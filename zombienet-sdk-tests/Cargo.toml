[package]
name = "zombienet-sdk-tests"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
publish = false
autotests = false

[[test]]
name = "tests"
path = "tests/tests.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
env_logger = "0.11"
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sp-core = { workspace = true, features = ["std"] }
tokio = { workspace = true }

# Zombienet SDK
zombienet-sdk = "0.4.6"

# Internal crates (reuse existing client SDKs)
file-system-client = { workspace = true }
file-system-primitives = { workspace = true }
s3-client = { workspace = true }
storage-client = { workspace = true }
storage-primitives = { workspace = true, features = ["std"] }

[features]
zombie-tests = []
