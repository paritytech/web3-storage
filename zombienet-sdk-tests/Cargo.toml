[package]
name = "zombienet-sdk-tests"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
publish = false
autotests = false

[[bin]]
name = "smoke"
path = "src/main.rs"

[[test]]
name = "tests"
path = "tests/tests.rs"

[dependencies]
anyhow = "1"
env_logger = "0.11"
log = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
zombienet-sdk = "0.4.6"

[dev-dependencies]
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
sp-core = { workspace = true, features = ["std"] }

# Internal crates (test-only: used by integration tests, not the smoke binary)
file-system-client = { workspace = true }
file-system-primitives = { workspace = true }
s3-client = { workspace = true }
storage-client = { workspace = true }
storage-primitives = { workspace = true, features = ["std"] }

[features]
zombie-tests = []
