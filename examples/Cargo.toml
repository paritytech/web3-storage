[package]
name = "storage-examples"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Demo binaries and tools for scalable Web3 storage"
publish = false

[dependencies]
storage-client = { workspace = true }
storage-primitives = { workspace = true, features = ["serde", "std"] }
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
tokio = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
hex = "0.4"
base64 = "0.22"
reqwest = { workspace = true }
scale-value = "0.16"
subxt = "0.37"
subxt-signer = { version = "0.37", features = ["sr25519"] }

[[bin]]
name = "demo_setup"
path = "src/bin/demo_setup.rs"

[[bin]]
name = "demo_upload"
path = "src/bin/demo_upload.rs"

[[bin]]
name = "demo_checkpoint"
path = "src/bin/demo_checkpoint.rs"

[[bin]]
name = "demo_challenge"
path = "src/bin/demo_challenge.rs"

[[bin]]
name = "challenge_watcher"
path = "src/bin/challenge_watcher.rs"
