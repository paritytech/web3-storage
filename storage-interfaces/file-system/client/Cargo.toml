[package]
name = "file-system-client"
version = "0.1.0"
edition = "2021"
authors = ["Parity Technologies <admin@parity.io>"]
license = "Apache-2.0"
description = "Client SDK for Layer 1 file system built on Scalable Web3 Storage"

[dependencies]
# Internal dependencies
file-system-primitives = { workspace = true, features = ["std"] }
storage-client = { workspace = true }
storage-primitives = { workspace = true }

# Async runtime
tokio = { workspace = true }
reqwest = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Codec
codec = { workspace = true }

# Substrate/Polkadot
sp-core = { workspace = true }
sp-runtime = { workspace = true }
frame-support = { workspace = true }

# Utilities
log = { workspace = true }
thiserror = "2.0"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
