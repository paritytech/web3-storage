[package]
name = "s3-primitives"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "S3-compatible storage interface primitives for web3-storage"

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
hex = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]

[features]
default = ["std"]
std = [
	"codec/std",
	"hex",
	"hex?/std",
	"scale-info/std",
	"sp-core/std",
	"sp-runtime/std",
]
