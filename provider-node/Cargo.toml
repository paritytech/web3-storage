[package]
name = "storage-provider-node"
version = "0.4.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Off-chain provider node for scalable Web3 storage"

[dependencies]
provider-auth = { workspace = true }
provider-chain = { workspace = true, features = ["all"] }
provider-challenge = { workspace = true }
provider-coordinator = { workspace = true }
provider-negotiation = { workspace = true }
provider-replica = { workspace = true }
provider-storage = { workspace = true }
storage-primitives = { workspace = true, features = ["serde", "std"] }
storage-subxt = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio-rate-limit = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
sp-core = { workspace = true, features = ["std"] }
sp-crypto-hashing = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
subxt = { workspace = true, features = ["light-client"] }
subxt-signer = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
parking_lot = { workspace = true }
hex = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive", "env"] }
reqwest = { workspace = true }
codec = { workspace = true, features = ["std"] }
async-trait = { workspace = true }

[dev-dependencies]
provider-storage = { workspace = true, features = ["test-helpers"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
