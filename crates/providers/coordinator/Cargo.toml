[package]
name = "provider-coordinator"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Chain-state coordinator for provider nodes: keeps the node's view of its on-chain registration, pallet constants, anchor block, and nonce counter in sync"

[dependencies]
async-trait = { workspace = true }
parking_lot = { workspace = true }
provider-chain = { workspace = true }
provider-storage = { workspace = true }
serde = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
storage-subxt = { workspace = true }
subxt = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
codec = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
provider-storage = { workspace = true, features = ["test-helpers"] }
serde_json = { workspace = true, features = ["std"] }
sp-crypto-hashing = { workspace = true, features = ["std"] }
subxt-rpcs = { workspace = true, features = ["mock-rpc-client"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
