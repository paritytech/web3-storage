[package]
name = "bucket-tree"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "File system and S3-style objects stored in a web3-storage bucket"

[dependencies]
# Internal dependencies
codec = { workspace = true, features = ["std"] }
storage-client = { workspace = true }
storage-primitives = { workspace = true, features = ["std"] }

async-trait = { workspace = true }
reqwest = { workspace = true }

bounded-collections = { workspace = true, features = ["scale-codec", "std"] }
primitive-types = { workspace = true, features = ["codec", "std"] }

# Utilities
thiserror = { workspace = true }

[dev-dependencies]
array-bytes = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
client-test-support = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
subxt-signer = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
