[package]
name = "file-system-client"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "Client SDK for Layer 1 file system built on Scalable Web3 Storage"

[dependencies]
# Internal dependencies
codec = { workspace = true, features = ["std"] }
storage-client = { workspace = true }
storage-primitives = { workspace = true, features = ["std"] }

# Async runtime
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }

# Substrate/Polkadot
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }

# Utilities
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
array-bytes = { workspace = true }
client-test-support = { workspace = true }
subxt-signer = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "ci_integration_test"
path = "examples/ci_integration_test.rs"
