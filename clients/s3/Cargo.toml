[package]
name = "s3-client"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
repository.workspace = true
description = "S3-compatible client SDK for web3-storage"

[dependencies]
# Internal
file-system-client = { workspace = true }
storage-client = { workspace = true }
storage-primitives = { workspace = true, features = ["std"] }
storage-subxt = { workspace = true }

# Substrate primitives
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }

# Async
futures = { workspace = true }

# Utilities
array-bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
client-test-support = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
subxt-signer = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "ci_integration_test"
path = "examples/ci_integration_test.rs"
