[package]
name = "pallet-s3-registry-precompile"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pallet_revive precompile exposing pallet_s3_registry to Solidity contracts"

[dependencies]
codec = { workspace = true, features = ["derive"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-revive = { workspace = true }
pallet-s3-registry = { workspace = true }
pallet-storage-provider = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
tracing = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-revive/std",
	"pallet-s3-registry/std",
	"pallet-storage-provider/std",
	"sp-core/std",
	"sp-runtime/std",
	"tracing/std",
]
runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-revive/runtime-benchmarks",
	"pallet-s3-registry/runtime-benchmarks",
	"pallet-storage-provider/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-revive/try-runtime",
	"pallet-s3-registry/try-runtime",
	"pallet-storage-provider/try-runtime",
	"sp-runtime/try-runtime",
]
