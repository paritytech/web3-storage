name: Start storage provider
description: >-
  Write a keyfile, launch storage-provider-node in the background, and wait for
  it to come up.

inputs:
  seed:
    description: SURI written to the keyfile the provider signs with.
    required: false
    default: "//Alice"
  mode:
    description: >-
      Storage backend: "disk", "inmemory", or "" to pass no --storage-mode and
      exercise the binary's own default.
    required: false
    default: ""
  port:
    description: Port the provider binds its HTTP API to.
    required: false
    default: "3333"
  storage-path:
    description: >-
      Data directory for disk mode, unique per provider — two RocksDB instances
      cannot share one. Ignored by inmemory.
    required: false
    default: /tmp/provider-data
  chain-rpc:
    description: Parachain RPC WebSocket URL.
    required: false
    default: ws://127.0.0.1:2222
  label:
    description: >-
      Short name for this provider. Labels the wait output and names the files
      written: /tmp/provider-<label>.{key,log}.
    required: false
    default: provider
  wait-for:
    description: Passed to wait-for-provider-health — "health" or "ready".
    required: false
    default: health
  wait-attempts:
    description: Poll attempts, 2s apart (60 ≈ 2min).
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SEED: ${{ inputs.seed }}
        MODE: ${{ inputs.mode }}
        PORT: ${{ inputs.port }}
        STORAGE_PATH: ${{ inputs.storage-path }}
        CHAIN_RPC: ${{ inputs.chain-rpc }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        KEYFILE="/tmp/provider-${LABEL}.key"
        LOG_FILE="/tmp/provider-${LABEL}.log"
        printf '%s\n' "$SEED" > "$KEYFILE"
        chmod 600 "$KEYFILE"

        echo "Starting ${LABEL} provider on :${PORT} (mode: ${MODE:-<binary default>})"
        # ${MODE:+...} expands to nothing when mode is empty, so the run gets no
        # --storage-mode flag and exercises the binary's default.
        nohup ./target/release/storage-provider-node \
          --keyfile "$KEYFILE" \
          ${MODE:+--storage-mode "$MODE"} \
          --storage-path "$STORAGE_PATH" \
          --bind-addr "0.0.0.0:${PORT}" \
          --chain-rpc "$CHAIN_RPC" \
          > "$LOG_FILE" 2>&1 &
        PID=$!

        # Fail fast if it exited immediately (bad flags, port in use, stale
        # RocksDB lock) rather than burning the whole poll timeout.
        sleep 2
        if ! kill -0 "$PID" 2>/dev/null; then
          echo "::error::${LABEL} provider exited immediately after launch."
          cat "$LOG_FILE" || true
          exit 1
        fi

    - uses: ./.github/actions/wait-for-provider-health
      with:
        url: http://127.0.0.1:${{ inputs.port }}
        wait-for: ${{ inputs.wait-for }}
        label: ${{ inputs.label }}
        log-file: /tmp/provider-${{ inputs.label }}.log
        attempts: ${{ inputs.wait-attempts }}
