name: Setup pnpm workspace
description: >
  Node + pnpm + cached store + frozen install of the repo-root pnpm workspace.
  Install Node first, then pnpm against that Node, then re-run setup-node to
  wire the pnpm-store cache (which needs `pnpm store path` available).
  pnpm/action-setup only installs a bootstrap pnpm and lets pnpm's own version
  switcher fetch the version pinned in packageManager. That switcher crashes
  with "Cannot use 'in' operator to search for 'integrity' in undefined" when
  the target is pnpm 11.12.0, so keep the pin on a version it can install
  (currently 11.11.0).

inputs:
  node-version:
    description: Node version to install (pass env.NODE_VERSION)
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node.js (for pnpm install)
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

    - name: Setup Node.js (with pnpm cache)
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # `pnpm install` runs the prepare script of packages/bucket-tree, which
    # builds the wasm module of clients/bucket-tree.
    - name: Install Rust toolchain with the wasm32-unknown-unknown target
      id: rust
      shell: bash
      run: |
        toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$toolchain" --profile minimal --target wasm32-unknown-unknown
        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
        echo "wasm-bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; print }' Cargo.lock | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

    - name: Install wasm-bindgen-cli at the Cargo.lock version
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: wasm-bindgen@${{ steps.rust.outputs.wasm-bindgen }}

    - name: Install workspace deps
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
      run: pnpm install --frozen-lockfile
