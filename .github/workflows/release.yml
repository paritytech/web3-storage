name: Release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to release
        type: choice
        options:
          - runtime
          - provider-node
        required: true
      version:
        description: >-
          Release version, e.g. 0.5.2. Must equal the component's Cargo.toml.
          The runtime becomes the tag v<version>-paseo, the provider node
          v<version>-provider.
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version, the tag and the spec_version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 0.5.2, got '$VERSION'"
            exit 1
          fi
          case "$COMPONENT" in
            runtime) MANIFEST=runtimes/web3-storage-paseo/Cargo.toml; TAG="v${VERSION}-paseo" ;;
            provider-node) MANIFEST=provider-node/Cargo.toml; TAG="v${VERSION}-provider" ;;
            *) echo "::error::unknown component '$COMPONENT'"; exit 1 ;;
          esac
          PKG_VERSION=$(awk -F'"' '/^version = / {print $2; exit}' "$MANIFEST")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::$MANIFEST is at $PKG_VERSION. Bump it to $VERSION first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          if [ "$COMPONENT" = runtime ]; then
            SPEC=$(sed -nE 's/^[[:space:]]*spec_version: ([0-9_]+),$/\1/p' runtimes/web3-storage-paseo/src/lib.rs | tr -d _)
            LATEST=$(scripts/latest-release-spec-version.sh)
            if [ -n "$LATEST" ] && [ "$SPEC" -le "$LATEST" ]; then
              echo "::error::spec_version $SPEC is not above $LATEST, the latest runtime release's. The fork upgrade would be a no-op and test nothing."
              exit 1
            fi
            echo "spec_version $SPEC (latest runtime release: ${LATEST:-none})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

  build:
    needs: [validate]
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      runtime: ${{ inputs.component == 'runtime' }}
      provider-node: ${{ inputs.component == 'provider-node' }}

  build-provider-macos:
    if: inputs.component == 'provider-node'
    needs: [validate]
    permissions:
      contents: read
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      runtime: false
      provider-node: false
      provider-node-macos: true

  check-migration:
    if: inputs.component == 'runtime'
    needs: [validate]
    permissions:
      contents: read
    uses: ./.github/workflows/check-runtime-migration.yml
    with:
      check: true

  chain-tests:
    needs: [build]
    permissions:
      contents: read
    uses: paritytech/polkadot-pop-e2e/.github/workflows/release-gate.yml@main
    with:
      environment: previewnet
      runtime_web3_storage: ${{ inputs.component == 'runtime' && 'artifact:web3-storage-paseo-runtime' || '' }}
      service_storage_provider_node: ${{ inputs.component == 'provider-node' && 'artifact:storage-provider-node' || '' }}
      runs_on: parity-large

  publish-runtime:
    if: inputs.component == 'runtime'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [validate, build, check-migration, chain-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web3-storage-paseo-runtime
          path: artifacts/web3-storage-paseo-runtime

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.wasm" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Add runtime info to changelog
        run: |
          CONTEXT=$(find . -name '*_srtool_output.json')
          SRTOOL() { <$(<<<$CONTEXT head -n1) jq -r .$1; }
          WASM() { <${JSON} jq -r ".runtimes.compressed.subwasm.$1"; }

          tee RELEASE_NOTES.md <<-EOF
          # Runtime info
          *These runtimes were built with **$(SRTOOL rustc)** using **[$(SRTOOL gen)](https://github.com/paritytech/srtool)***
          EOF

          for JSON in $(<<<$CONTEXT sort -sr)
          do
          RUNTIME_NAME=$(basename ${JSON} _srtool_output.json)
          tee -a RELEASE_NOTES.md <<-EOF

          ## ${RUNTIME_NAME}
          ~~~
          🏋️ Runtime Size:           $(numfmt --to iec-i --format "%.2f" $(WASM size)) ($(WASM size) bytes)
          🗜 Compressed:             $(WASM 'compression | if .compressed then "Yes: \(1 - .size_compressed / .size_decompressed | . * 10000 | round / 100)%" else "No" end')
          🔥 Core Version:           $(WASM 'core_version | "\(.specName)-\(.specVersion) \(.implName)-\(.implVersion).tx\(.transactionVersion).au\(.authoringVersion)"')
          🎁 Metadata version:       V$(WASM metadata_version)
          🗳️ Blake2-256 hash:        $(WASM blake2_256)
          📦 IPFS:                   $(WASM ipfs_hash)
          ~~~
          EOF
          done

          cat RELEASE_NOTES.md

      # Use the runner's preinstalled gh CLI rather than a third-party action;
      # the job already holds contents: write.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NAME: ${{ needs.build.outputs.runtime-name }} ${{ needs.validate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file RELEASE_NOTES.md \
            release-assets/*.wasm

  publish-provider-node:
    if: inputs.component == 'provider-node'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [validate, build, build-provider-macos, chain-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the provider archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: provider-node-*
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "storage-provider-node-*.tar.gz*" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Write release notes
        run: |
          {
            echo "## Provider node binaries"
            echo
            echo "| Target | sha256 |"
            echo "|---|---|"
            for SUM in release-assets/storage-provider-node-*.tar.gz.sha256; do
              [ -f "$SUM" ] || continue
              ARCHIVE=$(basename "$SUM" .sha256)
              HASH=$(awk '{print $1}' "$SUM")
              echo "| \`${ARCHIVE}\` | \`${HASH}\` |"
            done
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "storage-provider-node v${VERSION}" \
            --latest=false \
            --notes-file RELEASE_NOTES.md \
            release-assets/storage-provider-node-*.tar.gz \
            release-assets/storage-provider-node-*.tar.gz.sha256
