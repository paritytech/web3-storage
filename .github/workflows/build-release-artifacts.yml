name: Build release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Name the provider archive carries, e.g. v0.5.2-provider.
        type: string
        required: true
      runtime:
        description: Build the runtime.
        type: boolean
        default: true
      provider-node:
        description: Build the linux provider node.
        type: boolean
        default: true
      stamp-spec-version:
        description: >-
          Build the runtime with a spec_version above the latest runtime release's, so a
          fork upgrade to it is a real upgrade. A release keeps the committed one.
        type: boolean
        default: false
    outputs:
      runtime-name:
        description: The runtime's srtool chain name.
        value: ${{ jobs.build-runtime.outputs.name }}

permissions: {}

jobs:
  set-image:
    if: inputs.provider-node
    permissions:
      contents: read
    uses: ./.github/workflows/set-image.yml

  build-runtime:
    if: inputs.runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.config.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runtime config
        id: config
        run: |
          {
            echo "name=web3-storage-paseo"
            echo "package=storage-paseo-runtime"
            echo "path=runtimes/web3-storage-paseo"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp a spec_version above the latest release
        if: inputs.stamp-spec-version
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_DIR: ${{ steps.config.outputs.path }}
        run: |
          set -euo pipefail
          FILE="$RUNTIME_DIR/src/lib.rs"
          COMMITTED=$(sed -nE 's/^[[:space:]]*spec_version: ([0-9_]+),$/\1/p' "$FILE" | tr -d _)
          LATEST=$(scripts/latest-release-spec-version.sh)
          SPEC=$(( (${LATEST:-0} > COMMITTED ? ${LATEST:-0} : COMMITTED) + 1 ))
          sed -i -E "s/^([[:space:]]*spec_version: )[0-9_]+,$/\1${SPEC},/" "$FILE"
          grep -E '^[[:space:]]*spec_version: ' "$FILE"

      - name: Build ${{ steps.config.outputs.name }} runtime
        id: srtool_build
        uses: chevdor/srtool-actions@48e9baed50ca414936dfac59d34d8b9bbe581abd # v0.9.2
        with:
          chain: ${{ steps.config.outputs.name }}
          package: ${{ steps.config.outputs.package }}
          runtime_dir: ${{ steps.config.outputs.path }}
          profile: production

      - name: Store srtool digest
        env:
          SRTOOL_JSON: ${{ steps.srtool_build.outputs.json }}
          NAME: ${{ steps.config.outputs.name }}
        run: |
          echo "$SRTOOL_JSON" | jq > "${NAME}_srtool_output.json"

      - name: Upload ${{ steps.config.outputs.name }} wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.config.outputs.name }}-runtime
          path: |
            ${{ steps.srtool_build.outputs.wasm_compressed }}
            ${{ steps.config.outputs.name }}_srtool_output.json

  build-provider-linux:
    if: inputs.provider-node
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image]
    permissions:
      contents: read
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: release-provider-linux
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Build storage-provider-node (production)
        run: cargo build --profile production -p storage-provider-node --locked

      - name: Strip binary
        run: strip target/production/storage-provider-node

      - name: Upload storage-provider-node for the release gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: storage-provider-node
          path: target/production/storage-provider-node

      - name: Assert no OpenSSL/libssl in NEEDED
        run: |
          set -euo pipefail
          NEEDED=$(objdump -p target/production/storage-provider-node | awk '/NEEDED/ {print $2}')
          echo "NEEDED libraries:"
          echo "${NEEDED}"
          if echo "${NEEDED}" | grep -qE '^(libssl|libcrypto)\.'; then
            echo "::error::storage-provider-node links against OpenSSL (${NEEDED}). The binary must not depend on libssl/libcrypto so it runs on hosts without OpenSSL 1.1 (Ubuntu 22.04+, Debian 12+). Check reqwest/native-tls features."
            exit 1
          fi

      - name: Stage and archive
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TARGET=x86_64-unknown-linux-gnu
          PKG="storage-provider-node-${TAG}-${TARGET}"
          mkdir -p "dist/${PKG}"
          cp target/production/storage-provider-node "dist/${PKG}/"
          cp README.md "dist/${PKG}/" 2>/dev/null || true
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )
          ls -la dist/

      - name: Upload provider binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: provider-node-linux-amd64
          path: dist/storage-provider-node-*.tar.gz*
