name: UI E2E

# No top-level `paths:` filter: the required gate must always report. The
# expensive e2e job skips (via `changes`) when nothing relevant is touched; a
# workflow-level filter would instead leave the required check pending forever.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect e2e-relevant changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            e2e:
              - 'user-interfaces/**'
              - 'pallet/**'
              - 'runtime/**'
              - 'storage-interfaces/**'
              - 'provider-node/**'
              - '.github/workflows/ui-e2e.yml'

  set-image:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/set-image.yml

  ui-e2e:
    name: UI E2E run
    runs-on: parity-large
    timeout-minutes: 60
    needs: [changes, set-image]
    if: needs.changes.outputs.e2e == 'true'
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "integration-tests"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Cache zombienet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: zombienet-cache
        with:
          path: .bin/zombienet
          key: zombienet-${{ env.ZOMBIENET_VERSION }}

      - name: Download zombienet
        if: steps.zombienet-cache.outputs.cache-hit != 'true'
        run: just zombienet_version=${{ env.ZOMBIENET_VERSION }} download-zombienet

      - name: Build runtime and provider
        run: just build-paseo-runtime && just build-provider

      # The CI container ships an older Node (~14) that pnpm/action-setup@v6
      # rejects (`import.meta.resolve` requires ≥20.6). Install Node 22 first,
      # then pnpm against that Node, then re-run setup-node to wire the
      # pnpm-store cache (which needs `pnpm store path` available).
      - name: Setup Node.js (for pnpm install)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
        with:
          version: 10

      - name: Setup Node.js (with pnpm cache)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: user-interfaces/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: user-interfaces
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: user-interfaces
        run: pnpm --filter @web3-storage/drive-ui exec playwright install --with-deps chromium

      - name: Start chain
        run: |
          nohup env PROJECT_ROOT=$(pwd) .bin/zombienet spawn -p native zombienet/storage-paseo-local.toml > /tmp/zombienet.log 2>&1 &

      - name: Wait for parachain blocks
        uses: ./.github/actions/wait-for-parachain

      - name: Register provider on-chain
        run: |
          echo "//Alice" > /tmp/alice-key && chmod 600 /tmp/alice-key
          cargo run --release -p storage-client --example register_provider \
            ws://127.0.0.1:2222 http://127.0.0.1:3333 /ip4/127.0.0.1/tcp/3333 /tmp/alice-key

      - name: Start provider (Alice, inmemory) and wait for health
        run: |
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/alice-key --storage-mode inmemory \
            --bind-addr 0.0.0.0:3333 --chain-rpc ws://127.0.0.1:2222 \
            --enable-checkpoint-coordinator > /tmp/provider.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:3333/health | jq -e '.status' > /dev/null 2>&1; then
              echo "Provider healthy (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout: provider did not become healthy"
              cat /tmp/provider.log || true
              exit 1
            fi
            sleep 2
          done

      - name: drive-ui e2e
        working-directory: user-interfaces
        env:
          CI: "true"
        run: pnpm run test:e2e:drive-ui

      - name: console-ui e2e
        working-directory: user-interfaces
        env:
          CI: "true"
        run: pnpm run test:e2e:console-ui

      - name: provider e2e
        working-directory: user-interfaces
        env:
          CI: "true"
        run: pnpm run test:e2e:provider

      - name: Stop services
        if: always()
        run: |
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          pkill -f "storage-provider-node" 2>/dev/null || true

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-reports
          path: |
            user-interfaces/drive-ui/playwright-report
            user-interfaces/drive-ui/test-results
            user-interfaces/console-ui/playwright-report
            user-interfaces/console-ui/test-results
            user-interfaces/provider/playwright-report
            user-interfaces/provider/test-results

      - name: Upload chain + provider logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-e2e-service-logs
          path: |
            /tmp/zombienet.log
            /tmp/provider.log
            /tmp/zombie-*/*.log
            /tmp/zombie-*/**/*.log

  # Aggregate gate — the check to require in branch protection. Always reports:
  # green when the e2e job is skipped, red on real failure/cancellation.
  ui-e2e-gate:
    name: UI E2E Tests (chain + provider + UIs)
    needs: [changes, set-image, ui-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide outcome
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "UI E2E failed or was cancelled"
          exit 1
