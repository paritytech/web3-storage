name: Deploy UIs to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - "user-interfaces/**"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: user-interfaces/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: user-interfaces
        run: pnpm install --frozen-lockfile

      - name: Generate PAPI descriptors
        working-directory: user-interfaces
        run: |
          pnpm --filter @web3-storage/console-ui exec papi generate
          pnpm --filter @web3-storage/drive-ui exec papi generate

      - name: Build all UIs
        working-directory: user-interfaces
        env:
          GITHUB_PAGES: "true"
        run: |
          pnpm --filter @web3-storage/console-ui run build
          pnpm --filter provider-dashboard run build
          pnpm --filter @web3-storage/drive-ui run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Landing page at root
          cp user-interfaces/landing/index.html _site/
          cp user-interfaces/landing/404.html _site/
          # Each app in its subpath
          cp -r user-interfaces/console-ui/dist _site/console
          cp -r user-interfaces/provider/dist _site/provider
          cp -r user-interfaces/drive-ui/dist _site/drive
          # Per-app 404.html for SPA routing within each app
          cp user-interfaces/console-ui/dist/index.html _site/console/404.html
          cp user-interfaces/provider/dist/index.html _site/provider/404.html
          cp user-interfaces/drive-ui/dist/index.html _site/drive/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
