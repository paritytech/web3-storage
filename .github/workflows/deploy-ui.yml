name: Deploy UIs to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - "user-interfaces/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build all UIs
        env:
          GITHUB_PAGES: "true"
        run: |
          pnpm --filter @web3-storage/s3-ui run build
          pnpm --filter provider-dashboard run build
          pnpm --filter @web3-storage/drive-ui run build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Landing page at root — substitute sentinels from networks.ts/types.ts
          # (single source of truth for network ids, default, and endpoints).
          node user-interfaces/landing/inject-config.mjs \
            user-interfaces/landing/index.html _site/index.html
          cp user-interfaces/landing/404.html _site/
          # Each app in its subpath
          cp -r user-interfaces/s3-ui/dist _site/s3
          cp -r user-interfaces/provider/dist _site/provider
          cp -r user-interfaces/drive-ui/dist _site/drive
          # Per-app 404.html for SPA routing within each app
          cp user-interfaces/s3-ui/dist/index.html _site/s3/404.html
          cp user-interfaces/provider/dist/index.html _site/provider/404.html
          cp user-interfaces/drive-ui/dist/index.html _site/drive/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
