name: Basic checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  set-image:
    uses: ./.github/workflows/set-image.yml

  # Skip expensive jobs when only docs/markdown/non-Rust files changed.
  # The aggregate gate (basic-checks) always reports, so branch protection
  # stays safe even when jobs are skipped.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || steps.filter.outputs.rust == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # paths-filter has no diff base on merge_group; run the full suite there.
      - if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.config/**'
              - 'rust-toolchain.toml'
              - '.github/workflows/check.yml'
              - '.github/workflows/set-image.yml'
              - '.github/env'

  check-fmt:
    runs-on: parity-default
    timeout-minutes: 20
    needs: [set-image, changes]
    if: needs.changes.outputs.rust == 'true'
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cargo fmt
        run: |
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
          cargo +nightly fmt --all -- --check

      - name: Check TOML format
        run: |
          cargo install taplo-cli && taplo --version
          if ! taplo format --check --config .config/taplo.toml; then
            echo "Please run 'taplo format --config .config/taplo.toml' to fix any TOML formatting issues"
            exit 1
          fi
          cargo install --locked zepter && zepter --version
          if ! zepter run check --config .config/zepter.yaml; then
            echo "Please run 'zepter run --config .config/zepter.yaml' to fix any TOML formatting issues"
            exit 1
          fi

  check:
    name: Cargo check
    runs-on: parity-large
    needs: [set-image, changes]
    if: needs.changes.outputs.rust == 'true'
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-check"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Cargo check
        run: |
          cargo check --workspace --quiet
          cargo check --workspace --features=runtime-benchmarks --quiet
          cargo check --workspace --features=try-runtime --quiet

  clippy:
    name: Cargo clippy
    runs-on: parity-default
    needs: [set-image, check]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      RUSTFLAGS: "-D warnings"
      SKIP_WASM_BUILD: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-clippy"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Cargo clippy
        run: |
          cargo clippy --all-targets --locked --workspace --quiet
          cargo clippy --all-targets --all-features --locked --workspace --quiet

  test:
    name: Test
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, check]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-tests"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Run tests
        run: |
          cargo test --workspace

  benchmarks:
    name: Check Benchmarks
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, check]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-benchmarks"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Run test pallet-storage-provider
        run: |
          cargo test -p pallet-storage-provider --features runtime-benchmarks

      - name: Run test pallet-s3-registry
        run: |
          cargo test -p pallet-s3-registry --features runtime-benchmarks

      - name: Run test pallet-drive-registry
        run: |
          cargo test -p pallet-drive-registry --features runtime-benchmarks

  coverage:
    name: Rust coverage
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, check]
    if: github.event_name == 'pull_request'
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      SKIP_WASM_BUILD: 1
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout PR sources (with base branch history)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-coverage"
          save-if: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b8cecb83565409bcc297b2df6e77f030b2a468d5 # v2.82.0
        with:
          tool: cargo-llvm-cov

      - name: Install diff-cover
        # Drives the patch-coverage gate. The bullseye CI image ships an
        # unmanaged pip and runs as root, so a plain system-wide install works.
        run: python3 -m pip install --quiet "diff-cover>=9,<10"

      - name: Measure coverage
        env:
          # Coverage exclusions, anchored by path/name: generated code, pure-type
          # primitives, and the chain-access layer that can only run against a live
          # chain. Migrating these to a path/module-based exclusion is tracked in #178.
          COV_IGNORE: '(/\.cargo/|/rustc/|weights\.rs|runtime_api\.rs|mock\.rs|benchmarking\.rs|bechmarking\.rs|/primitives/|subxt_client\.rs|_subxt\.rs|checkpoint_coordinator\.rs|replica_sync_coordinator\.rs|replica_sync\.rs|challenge_responder\.rs|/command\.rs|/cli\.rs|/main\.rs)'
        run: |
          set -euo pipefail

          # Build + run the relevant tests once. A build/test failure aborts here
          # (no silent zero-coverage fallthrough like the old gate).
          cargo llvm-cov --no-report \
            -p pallet-storage-provider \
            -p pallet-drive-registry \
            -p pallet-s3-registry \
            -p storage-provider-node

          # Render the collected data in several formats without re-running tests.
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COV_IGNORE"
          cargo llvm-cov report --html --output-dir target/llvm-cov-html --ignore-filename-regex "$COV_IGNORE"
          cargo llvm-cov report --ignore-filename-regex "$COV_IGNORE" | tee coverage-summary.txt

          if [ ! -s lcov.info ]; then
            echo "::error::lcov.info is empty — coverage generation failed"
            exit 1
          fi

          # Make lcov source paths repo-relative so diff-cover matches git paths.
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" lcov.info

          # Per-file table -> job summary (collapsed) for at-a-glance diagnosis.
          {
            echo "## Rust coverage (per file)"
            echo ""
            echo "<details><summary>Full table</summary>"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: |
            lcov.info
            target/llvm-cov-html
          if-no-files-found: warn

      - name: Patch coverage gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # Minimum coverage of the lines this PR changes. Tune as the suite grows.
          MIN_PATCH_COV: '80'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Make origin/<base> available for the diff. The checkout is full-depth
          # (fetch-depth: 0), so this stays unshallow and the merge-base is reachable.
          git fetch --no-tags origin "$BASE_REF"

          # Gate only on lines changed by this PR: refactors/renames of already
          # covered (or excluded) code never move the number, and the report names
          # the exact uncovered lines.
          set +e
          diff-cover lcov.info \
            --compare-branch "origin/${BASE_REF}" \
            --fail-under "$MIN_PATCH_COV" \
            --show-uncovered \
            --markdown-report patch-coverage.md
          STATUS=$?
          set -e

          {
            echo "## Patch coverage vs \`${BASE_REF}\` (gate: ${MIN_PATCH_COV}%)"
            echo ""
            if [ -s patch-coverage.md ]; then cat patch-coverage.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Patch coverage below ${MIN_PATCH_COV}% — add tests for the new/changed lines listed in the job summary."
            exit 1
          fi
          echo "Patch coverage meets the ${MIN_PATCH_COV}% threshold."

  # Aggregate gate — the stable check to require in branch protection, instead
  # of pinning each job (fmt/check/clippy/test/benchmarks) individually.
  basic-checks:
    name: Basic checks
    needs: [changes, check-fmt, check, clippy, test, benchmarks, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide outcome
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Basic checks failed or were cancelled"
          exit 1
