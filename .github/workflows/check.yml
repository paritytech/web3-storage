name: Basic checks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  set-image:
    uses: ./.github/workflows/set-image.yml

  check-fmt:
    runs-on: parity-default
    timeout-minutes: 20
    needs: [set-image]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Cargo fmt
        run: |
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
          cargo +nightly fmt --all -- --check

      - name: Check TOML format
        run: |
          cargo install taplo-cli && taplo --version
          if ! taplo format --check --config .config/taplo.toml; then
            echo "Please run 'taplo format --config .config/taplo.toml' to fix any TOML formatting issues"
            exit 1
          fi
          cargo install --locked zepter && zepter --version
          if ! zepter run check --config .config/zepter.yaml; then
            echo "Please run 'zepter run --config .config/zepter.yaml' to fix any TOML formatting issues"
            exit 1
          fi

  check:
    name: Cargo check
    runs-on: parity-large
    needs: [set-image]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-check"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Cargo check
        run: |
          cargo check --workspace --quiet
          cargo check --workspace --features=runtime-benchmarks --quiet
          cargo check --workspace --features=try-runtime --quiet

  clippy:
    name: Cargo clippy
    runs-on: parity-default
    needs: [set-image, check]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      RUSTFLAGS: "-D warnings"
      SKIP_WASM_BUILD: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-clippy"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Cargo clippy
        run: |
          cargo clippy --all-targets --locked --workspace --quiet
          cargo clippy --all-targets --all-features --locked --workspace --quiet

  test:
    name: Test
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, check]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-tests"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Run tests
        run: |
          cargo test --workspace

  benchmarks:
    name: Check Benchmarks
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, check]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      SKIP_WASM_BUILD: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-benchmarks"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Run test pallet-storage-provider
        run: |
          cargo test -p pallet-storage-provider --features runtime-benchmarks

      - name: Run test pallet-s3-registry
        run: |
          cargo test -p pallet-s3-registry --features runtime-benchmarks

      - name: Run test pallet-drive-registry
        run: |
          cargo test -p pallet-drive-registry --features runtime-benchmarks

  coverage:
    name: Rust coverage
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, check]
    if: github.event_name == 'pull_request'
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    env:
      SKIP_WASM_BUILD: 1
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout PR sources (with base branch history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "web3-storage-cache-coverage"
          save-if: false

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure PR coverage
        run: |
          PALLET_COV=$(cargo llvm-cov --lib \
            -p pallet-storage-provider \
            -p pallet-drive-registry \
            -p pallet-s3-registry \
            --ignore-filename-regex='(weights\.rs|runtime_api\.rs|mock\.rs|primitives/|benchmarking\.rs|bechmarking\.rs)' \
            --summary-only 2>&1 \
            | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
          if [ -z "$PALLET_COV" ]; then
            echo "ERROR: Failed to measure pallet coverage (build or test failure?)"
            exit 1
          fi
          echo "PR_PALLET_COV=$PALLET_COV" >> $GITHUB_ENV
          echo "PR pallet coverage: ${PALLET_COV}%"

          cargo llvm-cov clean --workspace 2>/dev/null || true

          # Discover available integration test targets from filesystem
          TEST_FLAGS=""
          for f in provider-node/tests/*_integration.rs; do
            [ -f "$f" ] || continue
            t=$(basename "$f" .rs)
            TEST_FLAGS="$TEST_FLAGS --test $t"
          done

          if [ -n "$TEST_FLAGS" ]; then
            PROVIDER_COV=$(cargo llvm-cov $TEST_FLAGS \
              -p storage-provider-node \
              --ignore-filename-regex='(\.cargo|rustc|_subxt\.rs|command\.rs|cli\.rs|main\.rs)' \
              --summary-only 2>&1 \
              | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
          else
            PROVIDER_COV=0
          fi
          echo "PR_PROVIDER_COV=$PROVIDER_COV" >> $GITHUB_ENV
          echo "PR provider coverage: ${PROVIDER_COV}%"

      - name: Measure base branch coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Container user differs from repo owner; allow git operations
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git stash --include-untracked 2>/dev/null || true
          git checkout "$BASE_SHA"

          cargo llvm-cov clean --workspace 2>/dev/null || true

          BASE_PALLET_COV=$(cargo llvm-cov --lib \
            -p pallet-storage-provider \
            -p pallet-drive-registry \
            -p pallet-s3-registry \
            --ignore-filename-regex='(weights\.rs|runtime_api\.rs|mock\.rs|primitives/|benchmarking\.rs|bechmarking\.rs)' \
            --summary-only 2>&1 \
            | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
          if [ -z "$BASE_PALLET_COV" ]; then
            echo "ERROR: Failed to measure base pallet coverage (build or test failure?)"
            exit 1
          fi
          echo "BASE_PALLET_COV=$BASE_PALLET_COV" >> $GITHUB_ENV
          echo "Base pallet coverage: ${BASE_PALLET_COV}%"

          cargo llvm-cov clean --workspace 2>/dev/null || true

          # Discover available integration test targets from filesystem
          TEST_FLAGS=""
          for f in provider-node/tests/*_integration.rs; do
            [ -f "$f" ] || continue
            t=$(basename "$f" .rs)
            TEST_FLAGS="$TEST_FLAGS --test $t"
          done

          if [ -n "$TEST_FLAGS" ]; then
            BASE_PROVIDER_COV=$(cargo llvm-cov $TEST_FLAGS \
              -p storage-provider-node \
              --ignore-filename-regex='(\.cargo|rustc|_subxt\.rs|command\.rs|cli\.rs|main\.rs)' \
              --summary-only 2>&1 \
              | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
          else
            BASE_PROVIDER_COV=0
          fi
          echo "BASE_PROVIDER_COV=$BASE_PROVIDER_COV" >> $GITHUB_ENV
          echo "Base provider coverage: ${BASE_PROVIDER_COV}%"

          git checkout -
          git stash pop 2>/dev/null || true

      - name: Compare coverage
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  Rust Coverage (PR vs base)"
          echo "═══════════════════════════════════════════════════════════"
          echo ""

          FAILED=0
          for COMPONENT in PALLET PROVIDER; do
            eval "PR_VAL=\$PR_${COMPONENT}_COV"
            eval "BASE_VAL=\$BASE_${COMPONENT}_COV"
            LABEL=$(echo "$COMPONENT" | tr '[:upper:]' '[:lower:]')
            # Treat empty values as 0
            PR_VAL="${PR_VAL:-0}"
            BASE_VAL="${BASE_VAL:-0}"
            DECREASED=$(awk "BEGIN { print ($PR_VAL < $BASE_VAL) ? 1 : 0 }")
            if [ "$DECREASED" = "1" ]; then
              echo "FAIL: $LABEL coverage decreased: ${BASE_VAL}% → ${PR_VAL}%"
              FAILED=1
            else
              echo "PASS: $LABEL coverage: ${BASE_VAL}% → ${PR_VAL}%"
            fi
          done

          echo ""
          if [ "$FAILED" = "1" ]; then
            echo "Coverage decreased — add tests to cover new or modified code."
            exit 1
          fi

  # Aggregate gate — the stable check to require in branch protection, instead
  # of pinning each job (fmt/check/clippy/test/benchmarks) individually.
  basic-checks:
    name: Basic checks
    needs: [check-fmt, check, clippy, test, benchmarks, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide outcome
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Basic checks failed or were cancelled"
          exit 1
