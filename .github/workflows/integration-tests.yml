name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: "paritytech/ci-unified:bullseye-1.88.0-2025-06-27-v202507112050"

jobs:
  set-image:
    runs-on: ubuntu-latest
    outputs:
      CI_IMAGE: ${{ steps.set_image.outputs.CI_IMAGE }}
    steps:
      - id: set_image
        run: echo "CI_IMAGE=${{ env.CI_IMAGE }}" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "integration-tests"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Log binary versions
        run: |
          .bin/polkadot --version
          .bin/polkadot-omni-node --version

      - name: Build runtime and provider
        run: just build-runtime && just build-provider

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          include-hidden-files: true
          path: |
            target/release/storage-provider-node
            target/release/wbuild/
            .bin/

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate test matrix from zombie-tests.yml
        id: set-matrix
        run: |
          MATRIX=$(yq -o=json -I=0 '.tests' .github/zombie-tests.yml)
          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT

  test:
    name: ${{ matrix.name }}
    runs-on: parity-large
    timeout-minutes: ${{ matrix.timeout }}
    needs: [set-image, build, generate-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "integration-tests"
          save-if: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Restore artifact permissions
        run: |
          chmod +x target/release/storage-provider-node
          chmod +x .bin/*

      - name: Run test
        run: |
          cargo test --release -p zombienet-sdk-tests --features zombie-tests \
            ${{ matrix.filter }} -- --nocapture

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: |
            /tmp/provider.log
            /tmp/zombie-*/**/*.log
            /tmp/zombie-*/*.json

  # Single status check
  integration-tests:
    name: Integration Tests
    if: always()
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "All integration tests passed"
          else
            echo "Integration tests failed: ${{ needs.test.result }}"
            exit 1
          fi
