name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: "paritytech/ci-unified:bullseye-1.88.0-2025-06-27-v202507112050"

jobs:
  set-image:
    runs-on: ubuntu-latest
    outputs:
      CI_IMAGE: ${{ steps.set_image.outputs.CI_IMAGE }}
    steps:
      - id: set_image
        run: echo "CI_IMAGE=${{ env.CI_IMAGE }}" >> $GITHUB_OUTPUT

  integration-tests:
    name: Integration Tests
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          shared-key: "integration-tests"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Cache zombienet
        uses: actions/cache@v4
        id: zombienet-cache
        with:
          path: .bin/zombienet
          key: zombienet-${{ env.ZOMBIENET_VERSION }}

      - name: Download zombienet
        if: steps.zombienet-cache.outputs.cache-hit != 'true'
        run: just zombienet_version=${{ env.ZOMBIENET_VERSION }} download-zombienet

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build runtime and provider
        run: just build-runtime && just build-provider

      - name: Start chain and wait for blocks
        run: |
          nohup .bin/zombienet spawn zombienet.toml > /tmp/zombienet.log 2>&1 &
          ZOMBIE_PID=$!
          echo "Waiting for zombienet to set up nodes..."
          sleep 15
          if ! kill -0 $ZOMBIE_PID 2>/dev/null; then
            echo "ERROR: zombienet exited early"
            cat /tmp/zombienet.log || true
            exit 1
          fi
          echo "=== Early diagnostics (15s): zombienet temp directory ==="
          ZOMBIE_DIR=$(ls -d /tmp/zombie-* 2>/dev/null | head -1)
          if [ -n "$ZOMBIE_DIR" ]; then
            echo "Zombie dir: $ZOMBIE_DIR"
            echo "--- alice-1 collator keystore (parachain) ---"
            ls -la "$ZOMBIE_DIR"/alice-1/data/chains/storage-local/keystore/ 2>&1 || echo "NOT FOUND"
            echo "--- alice-1 collator keystore (relay) ---"
            ls -la "$ZOMBIE_DIR"/alice-1/relay-data/chains/westend_local_testnet/keystore/ 2>&1 || echo "NOT FOUND"
            echo "--- alice relay validator keystore ---"
            ls -la "$ZOMBIE_DIR"/alice/data/chains/westend_local_testnet/keystore/ 2>&1 || echo "NOT FOUND"
            echo "--- bob relay validator keystore ---"
            ls -la "$ZOMBIE_DIR"/bob/data/chains/westend_local_testnet/keystore/ 2>&1 || echo "NOT FOUND"
            echo "--- Parachain PLAIN chain spec session keys ---"
            jq '.genesis.runtimeGenesis.patch.session' "$ZOMBIE_DIR"/4000-westend-local-plain.json 2>/dev/null || echo "NOT FOUND in plain spec"
            echo "--- Parachain RAW chain spec session keys ---"
            jq '.genesis.runtimeGenesis.patch.session' "$ZOMBIE_DIR"/alice-1/cfg/*-4000.json 2>/dev/null || echo "NOT FOUND in raw spec (expected)"
            echo "--- Collator aura key in keystore ---"
            ls "$ZOMBIE_DIR"/alice-1/data/chains/storage-local/keystore/ 2>/dev/null | grep "^61757261" || echo "NO AURA KEY YET"
            echo "--- Chain spec files ---"
            ls -la "$ZOMBIE_DIR"/*.json 2>/dev/null || echo "NO JSON FILES"
          else
            echo "WARNING: no /tmp/zombie-* directory found"
          fi
          echo "=== End early diagnostics ==="
          ZOMBIE_DIR=$(ls -d /tmp/zombie-* 2>/dev/null | head -1)
          echo "Waiting for parachain to produce finalized blocks..."
          for i in $(seq 1 180); do
            # Check parachain finalized head
            RESPONSE=$(curl -s -H "Content-Type: application/json" \
              -d '{"id":1,"jsonrpc":"2.0","method":"chain_getFinalizedHead","params":[]}' \
              http://127.0.0.1:2222 2>/dev/null) || true
            FINALIZED_HASH=$(echo "$RESPONSE" | jq -r '.result // empty' 2>/dev/null)
            if [ -n "$FINALIZED_HASH" ]; then
              HEADER=$(curl -s -H "Content-Type: application/json" \
                -d "{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getHeader\",\"params\":[\"$FINALIZED_HASH\"]}" \
                http://127.0.0.1:2222 2>/dev/null) || true
              BLOCK_HEX=$(echo "$HEADER" | jq -r '.result.number // empty' 2>/dev/null)
              if [ -n "$BLOCK_HEX" ]; then
                BLOCK_NUM=$((BLOCK_HEX))
                if [ "$BLOCK_NUM" -ge 1 ]; then
                  echo "Parachain finalized block: #$BLOCK_NUM (attempt $i)"
                  break
                fi
              fi
            fi
            # Progress report every 20 iterations (~100s)
            if [ "$((i % 20))" -eq 0 ]; then
              echo "=== Progress check (attempt $i) ==="
              # Relay chain finalized block
              RELAY_RESP=$(curl -s -H "Content-Type: application/json" \
                -d '{"id":1,"jsonrpc":"2.0","method":"chain_getFinalizedHead","params":[]}' \
                http://127.0.0.1:9900 2>/dev/null) || true
              RELAY_HASH=$(echo "$RELAY_RESP" | jq -r '.result // empty' 2>/dev/null)
              if [ -n "$RELAY_HASH" ]; then
                RELAY_HDR=$(curl -s -H "Content-Type: application/json" \
                  -d "{\"id\":1,\"jsonrpc\":\"2.0\",\"method\":\"chain_getHeader\",\"params\":[\"$RELAY_HASH\"]}" \
                  http://127.0.0.1:9900 2>/dev/null) || true
                RELAY_BLOCK=$(echo "$RELAY_HDR" | jq -r '.result.number // empty' 2>/dev/null)
                echo "  Relay finalized: $RELAY_BLOCK"
              else
                echo "  Relay finalized: NO RESPONSE"
              fi
              # Parachain best block (chain_getHeader with no params = best)
              PARA_BEST=$(curl -s -H "Content-Type: application/json" \
                -d '{"id":1,"jsonrpc":"2.0","method":"chain_getHeader","params":[]}' \
                http://127.0.0.1:2222 2>/dev/null) || true
              PARA_BEST_NUM=$(echo "$PARA_BEST" | jq -r '.result.number // empty' 2>/dev/null)
              echo "  Parachain best: $PARA_BEST_NUM"
              echo "  Parachain finalized: ${BLOCK_HEX:-NO RESPONSE}"
              # Collator log - last 10 lines for progress
              if [ -n "$ZOMBIE_DIR" ]; then
                echo "  Collator log (last 10 lines):"
                tail -10 "$ZOMBIE_DIR"/alice-1.log 2>/dev/null | sed 's/^/    /' || echo "    NOT FOUND"
              fi
            fi
            if [ "$i" -eq 180 ]; then
              echo "=== TIMEOUT: parachain did not finalize blocks ==="
              ZOMBIE_DIR=$(ls -d /tmp/zombie-* 2>/dev/null | head -1)
              if [ -n "$ZOMBIE_DIR" ]; then
                echo "--- Collator alice-1 log (first 30 lines - startup) ---"
                head -30 "$ZOMBIE_DIR"/alice-1.log 2>/dev/null || echo "NOT FOUND"
                echo "--- Collator alice-1 log (last 50 lines) ---"
                tail -50 "$ZOMBIE_DIR"/alice-1.log 2>/dev/null || echo "NOT FOUND"
                echo "--- Relay alice log (last 30 lines) ---"
                tail -30 "$ZOMBIE_DIR"/alice.log 2>/dev/null || echo "NOT FOUND"
              else
                echo "WARNING: no /tmp/zombie-* directory found"
              fi
              echo "--- Zombienet log (last 50 lines) ---"
              tail -50 /tmp/zombienet.log 2>/dev/null || echo "EMPTY"
              echo "=== End timeout diagnostics ==="
              exit 1
            fi
            sleep 5
          done

      - name: Start provider and wait for health
        run: |
          SEED="//Alice" CHAIN_RPC="ws://127.0.0.1:2222" BIND_ADDR="0.0.0.0:3333" \
            nohup ./target/release/storage-provider-node > /tmp/provider.log 2>&1 &
          echo "Waiting for provider HTTP server..."
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:3333/health | jq -e '.status' > /dev/null 2>&1; then
              echo "Provider is healthy (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout: provider did not become healthy"
              cat /tmp/provider.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run demo
        run: just demo

      - name: Stop services
        if: always()
        run: |
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          pkill -f "storage-provider-node" 2>/dev/null || true

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: |
            /tmp/zombienet.log
            /tmp/provider.log
            /tmp/zombie-*/*.log
            /tmp/zombie-*/**/*.log
            /tmp/zombie-*/alice-1/data/chains/storage-local/keystore/
            /tmp/zombie-*/alice-1/relay-data/chains/westend_local_testnet/keystore/
            /tmp/zombie-*/alice-1/cfg/
            /tmp/zombie-*/alice/data/chains/westend_local_testnet/keystore/
            /tmp/zombie-*/bob/data/chains/westend_local_testnet/keystore/
            /tmp/zombie-*/*-plain.json
            /tmp/zombie-*/*-raw.json
