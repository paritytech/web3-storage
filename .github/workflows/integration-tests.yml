name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  set-image:
    uses: ./.github/workflows/set-image.yml

  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    name: Extract tasks from matrix
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: runtime
        run: |
          TASKS=$(jq '[.[] | select(.integration_tests == true)]' scripts/runtimes-matrix.json)
          SKIPPED=$(jq '[.[] | select(.integration_tests != true)]' scripts/runtimes-matrix.json)
          echo "--- Running integration tests for ---"
          echo "$TASKS"
          echo "--- Skipping integration tests for ---"
          echo "$SKIPPED"
          TASKS=$(echo "$TASKS" | jq -c .)
          echo "runtime=$TASKS" >> $GITHUB_OUTPUT

  integration-tests:
    name: Integration Tests (${{ matrix.runtime.name }})
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, runtime-matrix]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.runtime-matrix.outputs.runtime) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "integration-tests-${{ matrix.runtime.name }}"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Cache zombienet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: zombienet-cache
        with:
          path: .bin/zombienet
          key: zombienet-${{ env.ZOMBIENET_VERSION }}

      - name: Download zombienet
        if: steps.zombienet-cache.outputs.cache-hit != 'true'
        run: just zombienet_version=${{ env.ZOMBIENET_VERSION }} download-zombienet

      - name: Log binary versions
        run: |
          .bin/zombienet --version
          .bin/polkadot --version
          .bin/polkadot-omni-node --version

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build runtime and provider
        run: just ${{ matrix.runtime.build_command }} && just build-provider

      - name: Start chain
        run: |
          nohup env PROJECT_ROOT=$(pwd) .bin/zombienet spawn -p native ${{ matrix.runtime.zombienet_config }} > /tmp/zombienet.log 2>&1 &
          ZOMBIE_PID=$!
          echo "Waiting for zombienet to set up nodes..."
          sleep 15
          if ! kill -0 $ZOMBIE_PID 2>/dev/null; then
            echo "ERROR: zombienet exited early"
            cat /tmp/zombienet.log || true
            exit 1
          fi

      - name: Wait for parachain blocks
        uses: ./.github/actions/wait-for-parachain

      - name: Start provider (inmemory) and wait for health
        run: |
          echo "//Alice" > /tmp/alice-key && chmod 600 /tmp/alice-key
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/alice-key --storage-mode inmemory \
            --bind-addr 0.0.0.0:3333 --chain-rpc ws://127.0.0.1:2222 \
            --enable-checkpoint-coordinator > /tmp/provider.log 2>&1 &
          echo "Waiting for provider HTTP server..."
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:3333/health | jq -e '.status' > /dev/null 2>&1; then
              echo "Provider is healthy (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout: provider did not become healthy"
              cat /tmp/provider.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Start provider (disk) and wait for health
        run: |
          echo "//Charlie" > /tmp/charlie-key && chmod 600 /tmp/charlie-key
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/charlie-key --storage-mode disk --storage-path /tmp/provider-data \
            --bind-addr 0.0.0.0:3334 --chain-rpc ws://127.0.0.1:2222 \
            --enable-checkpoint-coordinator > /tmp/provider.log 2>&1 &
          echo "Waiting for disk provider HTTP server..."
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:3334/health | jq -e '.status' > /dev/null 2>&1; then
              echo "Disk provider is healthy (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout: disk provider did not become healthy"
              cat /tmp/provider-disk.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run L0 demo (inmemory provider)
        run: just demo "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run L0 demo (disk provider)
        run: just drain-tx-pool-then demo "http://127.0.0.1:3334" "//Charlie" "//Dave"

      - name: Run file system integration test
        run: just drain-tx-pool-then fs-demo-ci

      - name: Run S3 integration test
        run: just drain-tx-pool-then s3-demo-ci

      - name: Run PAPI s3-lifecycle demo
        run: just drain-tx-pool-then papi-s3-lifecycle "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run PAPI drive-lifecycle demo
        run: just drain-tx-pool-then papi-drive-lifecycle "http://127.0.0.1:3333" "//Alice" "//Bob" "//Ferdie"

      - name: Stop services
        if: always()
        run: |
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          pkill -f "storage-provider-node" 2>/dev/null || true

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-${{ matrix.runtime.name }}
          path: |
            /tmp/zombienet.log
            /tmp/provider.log
            /tmp/provider-disk.log
            /tmp/zombie-*/*.log
            /tmp/zombie-*/**/*.log
            /tmp/zombie-*/*-plain.json
            /tmp/zombie-*/*-raw.json

  # Smart-contract demos run in a parallel job with their own chain +
  # provider — the sequential time of L0 demos + fs/s3 lifecycles + sc demos
  # was bumping against the 60-minute job timeout. Parallel splits the
  # wall-clock roughly in half; SC tests only need //Alice as a provider.
  sc-integration-tests:
    name: SC Integration Tests (${{ matrix.runtime.name }})
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image, runtime-matrix]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.runtime-matrix.outputs.runtime) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "sc-integration-tests-${{ matrix.runtime.name }}"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Cache zombienet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: zombienet-cache
        with:
          path: .bin/zombienet
          key: zombienet-${{ env.ZOMBIENET_VERSION }}

      - name: Download zombienet
        if: steps.zombienet-cache.outputs.cache-hit != 'true'
        run: just zombienet_version=${{ env.ZOMBIENET_VERSION }} download-zombienet

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install solc and resolc
        run: |
          for bin_url in \
            "/usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux" \
            "/usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v${RESOLC_VERSION}/resolc-x86_64-unknown-linux-musl"; do
            dest="${bin_url%% *}"
            url="${bin_url#* }"
            for attempt in 1 2 3; do
              echo "Downloading $dest (attempt $attempt/3)..."
              if curl -L --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 600 \
                  -o "$dest" "$url"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to download $dest after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
          chmod +x /usr/local/bin/solc /usr/local/bin/resolc
          solc --version
          resolc --version

      - name: Build runtime and provider
        run: just ${{ matrix.runtime.build_command }} && just build-provider

      - name: Build example contracts
        run: just build-contracts

      - name: Start chain
        run: |
          nohup env PROJECT_ROOT=$(pwd) .bin/zombienet spawn -p native ${{ matrix.runtime.zombienet_config }} > /tmp/zombienet.log 2>&1 &
          ZOMBIE_PID=$!
          echo "Waiting for zombienet to set up nodes..."
          sleep 15
          if ! kill -0 $ZOMBIE_PID 2>/dev/null; then
            echo "ERROR: zombienet exited early"
            cat /tmp/zombienet.log || true
            exit 1
          fi

      - name: Wait for parachain blocks
        uses: ./.github/actions/wait-for-parachain

      - name: Start provider (inmemory) and wait for health
        run: |
          echo "//Alice" > /tmp/alice-key && chmod 600 /tmp/alice-key
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/alice-key --storage-mode inmemory \
            --bind-addr 0.0.0.0:3333 --chain-rpc ws://127.0.0.1:2222 \
            --enable-checkpoint-coordinator > /tmp/provider.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:3333/health | jq -e '.status' > /dev/null 2>&1; then
              echo "Provider is healthy (attempt $i)"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout: provider did not become healthy"
              cat /tmp/provider.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run smart-contract end-to-end demo
        run: just sc-demo "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run smart-contract precompile-coverage e2e
        run: just drain-tx-pool-then sc-coverage "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run SharedTeamDrive dApp e2e
        run: just drain-tx-pool-then sc-team-drive "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run TokenGatedDrive dApp e2e
        run: just drain-tx-pool-then sc-token-gated "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Stop services
        if: always()
        run: |
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          pkill -f "storage-provider-node" 2>/dev/null || true

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sc-integration-test-logs-${{ matrix.runtime.name }}
          path: |
            /tmp/zombienet.log
            /tmp/provider.log
            /tmp/zombie-*/*.log
            /tmp/zombie-*/**/*.log
            /tmp/zombie-*/*-plain.json
            /tmp/zombie-*/*-raw.json

  integration-tests-complete:
    name: Integration Tests
    needs: [integration-tests, sc-integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide outcome
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Integration tests failed or were cancelled"
          exit 1
