name: Integration Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  set-image:
    uses: ./.github/workflows/set-image.yml

  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
    name: Extract tasks from matrix
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: runtime
        run: |
          TASKS=$(jq '[.[] | select(.integration_tests == true)]' scripts/runtimes-matrix.json)
          SKIPPED=$(jq '[.[] | select(.integration_tests != true)]' scripts/runtimes-matrix.json)
          echo "--- Running integration tests for ---"
          echo "$TASKS"
          echo "--- Skipping integration tests for ---"
          echo "$SKIPPED"
          TASKS=$(echo "$TASKS" | jq -c .)
          echo "runtime=$TASKS" >> $GITHUB_OUTPUT

  # ── Build once ────────────────────────────────────────────────────────────
  # Compiles the heaviest, shared artifacts a single time and publishes them as
  # one artifact the integration-tests and sc-integration-tests jobs download
  # instead of each rebuilding from scratch. The artifact holds:
  #   - target/release/storage-provider-node — the provider binary,
  #   - the *.compact.compressed.wasm runtime per integration-tested runtime,
  #     which the chain_spec_command scripts feed to chain-spec-builder.
  # NOTE: this does not eliminate all compilation downstream — the test jobs
  # still `cargo run` the fs/s3 ci_integration_test examples and the sc job
  # still builds the Solidity contracts. Those lean on the shared Rust cache
  # (shared-key "integration-tests-build"), not on this artifact. The
  # e2e-integration-tests job does not use this artifact at all (it builds a
  # coverage-instrumented provider and its runtime via the chain-spec script).
  build:
    name: Build
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "integration-tests-build"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      # Build every runtime whose build_command the matrix file declares, so the
      # single artifact carries a wasm for each runtime the test jobs fan out on.
      - name: Build all runtimes
        run: |
          for cmd in $(jq -r '.[] | select(.integration_tests == true) | .build_command' scripts/runtimes-matrix.json); do
            echo "::group::just $cmd"
            just "$cmd"
            echo "::endgroup::"
          done

      - name: Build provider
        run: just build-provider

      # Upload only what the test jobs actually consume: the provider binary and
      # the final compressed runtime wasm per runtime (the chain_spec_command
      # scripts read target/release/wbuild/<pkg>/<pkg>.compact.compressed.wasm).
      # The full wbuild tree is a ~900 MiB / 3400-file Cargo scratch dir — never
      # upload it. Both listed paths sit under target/release, so the artifact's
      # least-common-ancestor root is target/release; the download step below
      # extracts into target/release to put the prefix back.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build
          retention-days: 1
          if-no-files-found: error
          path: |
            target/release/storage-provider-node
            target/release/wbuild/*/*.compact.compressed.wasm

  # ── L0 / file-system / S3 demos ───────────────────────────────────────────
  # Runs against its OWN chain + inmemory and disk providers. Demos stay
  # sequential on the shared chain (drain-tx-pool-then between them), but the
  # job skips the build entirely and consumes the prebuilt artifact, so it runs
  # in parallel with e2e-integration-tests and sc-integration-tests.
  integration-tests:
    name: Integration Tests (${{ matrix.runtime.name }})
    runs-on: parity-large
    timeout-minutes: 30
    needs: [set-image, runtime-matrix, build]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.runtime-matrix.outputs.runtime) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Cache zombienet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: zombienet-cache
        with:
          path: .bin/zombienet
          key: zombienet-${{ env.ZOMBIENET_VERSION }}

      - name: Download zombienet
        if: steps.zombienet-cache.outputs.cache-hit != 'true'
        run: just zombienet_version=${{ env.ZOMBIENET_VERSION }} download-zombienet

      - name: Log binary versions
        run: |
          .bin/zombienet --version
          .bin/polkadot --version
          .bin/polkadot-omni-node --version

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Restored before the artifact download so the cached target/ can't clobber
      # the freshly downloaded provider + wbuild. save-if false — only the build
      # job writes this cache. The fs/s3 demos still `cargo run` example binaries,
      # so the warm cache keeps that compilation fast.
      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "integration-tests-build"
          save-if: false

      # Extract into target/release so the artifact's target/release-rooted
      # contents (provider binary + wbuild wasm) land back at their original
      # paths — where the chmod step, the chain_spec_command scripts, and the
      # demos all expect them.
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: build
          path: target/release

      - name: Restore executable bits
        run: chmod +x target/release/storage-provider-node

      - name: Start chain
        uses: ./.github/actions/start-zombienet
        with:
          config: ${{ matrix.runtime.zombienet_config }}

      - name: Wait for parachain blocks
        uses: ./.github/actions/wait-for-parachain

      - name: Start provider (inmemory)
        run: |
          echo "//Alice" > /tmp/alice-key && chmod 600 /tmp/alice-key
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/alice-key --storage-mode inmemory \
            --bind-addr 0.0.0.0:3333 --chain-rpc ws://127.0.0.1:2222 \
            --enable-agreement-coordinator --enable-checkpoint-coordinator \
            > /tmp/provider.log 2>&1 &

      - name: Start provider (disk)
        run: |
          echo "//Charlie" > /tmp/charlie-key && chmod 600 /tmp/charlie-key
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/charlie-key --storage-mode disk --storage-path /tmp/provider-data \
            --bind-addr 0.0.0.0:3334 --chain-rpc ws://127.0.0.1:2222 \
            --enable-agreement-coordinator --enable-checkpoint-coordinator \
            > /tmp/provider-disk.log 2>&1 &

      - name: Wait for provider (inmemory) health
        uses: ./.github/actions/wait-for-provider-health
        with:
          label: inmemory

      - name: Wait for provider (disk) health
        uses: ./.github/actions/wait-for-provider-health
        with:
          url: http://127.0.0.1:3334
          label: disk
          log-file: /tmp/provider-disk.log

      - name: Run L0 demo (disk provider)
        run: just demo "http://127.0.0.1:3334" "//Charlie" "//Dave"

      - name: Run file system integration test
        run: just drain-tx-pool-then fs-demo-ci

      - name: Run S3 integration test
        run: just drain-tx-pool-then s3-demo-ci

      - name: Stop services
        if: always()
        run: |
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          pkill -f "storage-provider-node" 2>/dev/null || true

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-logs-${{ matrix.runtime.name }}
          path: |
            /tmp/zombienet.log
            /tmp/provider.log
            /tmp/provider-disk.log
            /tmp/zombie-*/*.log
            /tmp/zombie-*/**/*.log
            /tmp/zombie-*/*-plain.json
            /tmp/zombie-*/*-raw.json

  # E2E test suite — runs all 10 PAPI E2E workflows against a single
  # inmemory provider. Uses web3-storage-paseo only: the storage pallet
  # config is identical across runtimes so running both would just double
  # CI time with zero extra coverage. Its chain-spec script is resolved from
  # runtimes-matrix.json by that runtime name (see the resolve step below), so
  # it can't drift from the rest of the runtime config. Self-contained: it does
  # NOT consume the shared build artifact — its provider is built here with
  # coverage instrumentation, and its runtime wasm is built by the chain-spec
  # script at chain start. So it skips `needs: build` and runs in parallel with it.
  e2e-integration-tests:
    name: E2E Integration Tests
    runs-on: parity-large
    timeout-minutes: 60
    needs: [set-image]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      # Single-source the chain-spec script from the matrix so it can't drift
      # from the rest of the runtime config. The E2E suite runs on
      # web3-storage-paseo (see job comment above).
      - name: Resolve chain-spec script from matrix
        run: |
          RUNTIME=web3-storage-paseo
          SCRIPT=$(jq -r --arg r "$RUNTIME" '.[] | select(.name==$r) | .chain_spec_script // empty' scripts/runtimes-matrix.json)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: no chain_spec_script for runtime '$RUNTIME' in scripts/runtimes-matrix.json"
            exit 1
          fi
          echo "Using chain-spec script: $SCRIPT"
          echo "E2E_CHAIN_SPEC_SCRIPT=$SCRIPT" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "e2e-integration-tests"
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Log binary versions
        run: |
          .bin/polkadot-omni-node --version
          .bin/chain-spec-builder --version 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build provider with coverage instrumentation
        run: |
          cargo build --release -p storage-provider-node
          # Verify the binary contains LLVM coverage symbols
          if nm ./target-cov/release/storage-provider-node 2>/dev/null | grep -q "__llvm_profile"; then
            echo "Binary is coverage-instrumented"
          else
            echo "WARNING: Binary may not be coverage-instrumented"
          fi
          # Clean up stray profraw files from build step (proc-macro, build scripts)
          rm -f ./*.profraw ./default_*.profraw 2>/dev/null || true
        env:
          RUSTFLAGS: "-C instrument-coverage"
          CARGO_TARGET_DIR: target-cov
          CARGO_INCREMENTAL: '0'

      - name: Start chain (dev mode, 2s blocks)
        uses: ./.github/actions/start-e2e-chain
        with:
          chain-spec-script: ${{ env.E2E_CHAIN_SPEC_SCRIPT }}

      - name: Wait for parachain blocks
        uses: ./.github/actions/wait-for-parachain

      - name: Start provider (inmemory, coverage-instrumented)
        run: |
          echo "//Alice" > /tmp/alice-key && chmod 600 /tmp/alice-key
          mkdir -p /tmp/coverage
          # %c = continuous mode: profraw is mmap'd and flushed in real-time,
          # so coverage data survives even SIGKILL (process doesn't need a
          # clean exit for atexit handlers to run).
          LLVM_PROFILE_FILE="/tmp/coverage/provider-%p%c.profraw" \
            nohup ./target-cov/release/storage-provider-node \
              --keyfile /tmp/alice-key --storage-mode inmemory \
              --bind-addr 0.0.0.0:3333 --chain-rpc ws://127.0.0.1:2222 \
              --enable-agreement-coordinator --enable-checkpoint-coordinator \
              > /tmp/provider.log 2>&1 &
          PROVIDER_PID=$!
          echo "Provider PID: $PROVIDER_PID"
          echo "PROVIDER_PID=$PROVIDER_PID" >> $GITHUB_ENV

      - name: Wait for provider health
        uses: ./.github/actions/wait-for-provider-health

      - name: Run E2E test suite
        run: just e2e "http://127.0.0.1:3333"

      - name: Print JS coverage
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  JS Coverage (api.js, common.js)"
          echo "═══════════════════════════════════════════════════════════"
          cd examples/papi && npx c8 report --reporter=text
          echo ""

      - name: Run pallet unit tests with coverage
        if: always()
        run: |
          # Pallet runs as WASM on-chain so E2E tests can't instrument it.
          # Instead, run pallet unit tests with native coverage instrumentation.
          rm -f /tmp/coverage/pallet-*.profraw 2>/dev/null || true
          LLVM_PROFILE_FILE="/tmp/coverage/pallet-%p-%m.profraw" \
            cargo test -p pallet-storage-provider --lib
        env:
          RUSTFLAGS: "-C instrument-coverage"
          CARGO_TARGET_DIR: target-cov
          CARGO_INCREMENTAL: '0'

      - name: Generate pallet coverage report
        if: always()
        run: |
          if ls /tmp/coverage/pallet-*.profraw 1>/dev/null 2>&1; then
            rustup component add llvm-tools 2>/dev/null || true
            LLVM_PROFDATA=$(find $(rustc --print sysroot) -name llvm-profdata -type f | head -1)
            LLVM_COV=$(find $(rustc --print sysroot) -name llvm-cov -type f | head -1)
            if [ -n "$LLVM_PROFDATA" ] && [ -n "$LLVM_COV" ]; then
              "$LLVM_PROFDATA" merge -sparse /tmp/coverage/pallet-*.profraw -o /tmp/coverage/pallet.profdata
              # Find the test binary — cargo test (no --release) builds under debug/
              PALLET_TEST_BIN=$(find ./target-cov/debug/deps -name "pallet_storage_provider-*" -executable ! -name "*.d" | head -1)
              if [ -n "$PALLET_TEST_BIN" ]; then
                echo ""
                echo "═══════════════════════════════════════════════════════════"
                echo "  Rust Pallet Coverage (pallet/src/)"
                echo "═══════════════════════════════════════════════════════════"
                "$LLVM_COV" report \
                  "$PALLET_TEST_BIN" \
                  --instr-profile=/tmp/coverage/pallet.profdata \
                  --ignore-filename-regex='(\.cargo|rustc|target-cov)' \
                  --sources pallet/src/
                echo ""
                mkdir -p /tmp/coverage/report
                "$LLVM_COV" export \
                  "$PALLET_TEST_BIN" \
                  --instr-profile=/tmp/coverage/pallet.profdata \
                  --ignore-filename-regex='(\.cargo|rustc|target-cov)' \
                  --sources pallet/src/ \
                  --format=lcov > /tmp/coverage/report/pallet-lcov.info 2>/dev/null || true
              else
                echo "WARNING: Could not find pallet test binary"
              fi
            fi
          else
            echo "WARNING: No pallet profraw files found"
          fi

      - name: Stop services and generate Rust coverage
        if: always()
        run: |
          # SIGTERM first so the LLVM atexit handler can flush profraw
          # (continuous mode %c may not be supported on all LLVM versions).
          # Fall back to SIGKILL after a grace period.
          kill "$PROVIDER_PID" 2>/dev/null || pkill -f "storage-provider-node" 2>/dev/null || true
          sleep 5
          kill -9 "$PROVIDER_PID" 2>/dev/null || pkill -9 -f "storage-provider-node" 2>/dev/null || true
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          sleep 2

          echo "=== Provider coverage profraw ==="
          ls -la /tmp/coverage/provider-*.profraw 2>/dev/null || echo "  (no provider profraw files)"

          # Generate Rust coverage report from provider profraw only
          # (pallet profraw is handled in the earlier step)
          find /tmp/coverage -name "provider-*.profraw" -empty -delete 2>/dev/null || true
          if ls /tmp/coverage/provider-*.profraw 1>/dev/null 2>&1; then
            rustup component add llvm-tools 2>/dev/null || true
            LLVM_PROFDATA=$(find $(rustc --print sysroot) -name llvm-profdata -type f | head -1)
            LLVM_COV=$(find $(rustc --print sysroot) -name llvm-cov -type f | head -1)
            if [ -n "$LLVM_PROFDATA" ] && [ -n "$LLVM_COV" ]; then
              mkdir -p /tmp/coverage/report
              "$LLVM_PROFDATA" merge -sparse /tmp/coverage/provider-*.profraw -o /tmp/coverage/provider.profdata
              echo ""
              echo "═══════════════════════════════════════════════════════════"
              echo "  Rust Provider Coverage (provider-node/src/)"
              echo "═══════════════════════════════════════════════════════════"
              "$LLVM_COV" report \
                ./target-cov/release/storage-provider-node \
                --instr-profile=/tmp/coverage/provider.profdata \
                --ignore-filename-regex='(\.cargo|rustc|target-cov)' \
                --sources provider-node/src/
              echo ""
              "$LLVM_COV" export \
                ./target-cov/release/storage-provider-node \
                --instr-profile=/tmp/coverage/provider.profdata \
                --ignore-filename-regex='(\.cargo|rustc|target-cov)' \
                --sources provider-node/src/ \
                --format=lcov > /tmp/coverage/report/rust-lcov.info 2>/dev/null || true
            else
              echo "WARNING: llvm-profdata or llvm-cov not found"
            fi
          else
            echo "WARNING: No non-empty provider-*.profraw files"
            echo "  Continuous mode (%c) may not be supported by this LLVM version."
            echo "  Last 10 lines of provider log:"
            tail -10 /tmp/provider.log 2>/dev/null || echo "  (no log)"
          fi

      - name: Extract coverage summary
        if: always()
        run: |
          mkdir -p /tmp/coverage/report

          # ── Pallet line coverage ──
          PALLET_COV="0"
          if [ -f /tmp/coverage/pallet.profdata ]; then
            LLVM_COV=$(find $(rustc --print sysroot) -name llvm-cov -type f | head -1)
            PALLET_TEST_BIN=$(find ./target-cov/debug/deps -name "pallet_storage_provider-*" -executable ! -name "*.d" | head -1)
            if [ -n "$LLVM_COV" ] && [ -n "$PALLET_TEST_BIN" ]; then
              PALLET_COV=$("$LLVM_COV" report "$PALLET_TEST_BIN" \
                --instr-profile=/tmp/coverage/pallet.profdata \
                --ignore-filename-regex='(\.cargo|rustc|target-cov|weights\.rs|runtime_api\.rs|mock\.rs|primitives/)' \
                --sources pallet/src/ 2>/dev/null \
                | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
            fi
          fi

          # ── Provider line coverage ──
          PROVIDER_COV="0"
          if [ -f /tmp/coverage/provider.profdata ]; then
            LLVM_COV=$(find $(rustc --print sysroot) -name llvm-cov -type f | head -1)
            if [ -n "$LLVM_COV" ]; then
              PROVIDER_COV=$("$LLVM_COV" report ./target-cov/release/storage-provider-node \
                --instr-profile=/tmp/coverage/provider.profdata \
                --ignore-filename-regex='(\.cargo|rustc|target-cov)' \
                --sources provider-node/src/ 2>/dev/null \
                | grep '^TOTAL' | awk '{print $10}' | tr -d '%')
            fi
          fi

          # ── JS line coverage ──
          JS_COV="0"
          if [ -f examples/papi/coverage/coverage-final.json ]; then
            JS_COV=$(cd examples/papi && npx c8 report --reporter=text 2>/dev/null \
              | grep 'All files' | awk '{print $10}' | tr -d '%' || echo "0")
          fi

          echo "{\"pallet\": ${PALLET_COV:-0}, \"provider\": ${PROVIDER_COV:-0}, \"js\": ${JS_COV:-0}}" \
            > /tmp/coverage/report/coverage-summary.json

          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  Coverage Summary"
          echo "═══════════════════════════════════════════════════════════"
          cat /tmp/coverage/report/coverage-summary.json | python3 -m json.tool
          echo ""

      - name: Cache coverage baseline (main/dev only)
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/coverage/report/coverage-summary.json
          key: coverage-baseline-${{ github.sha }}

      # Overwrite the well-known key so PRs always restore the latest baseline.
      # actions/cache is immutable per key, so we delete-then-save to update.
      - name: Update latest coverage baseline (main/dev only)
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete the previous "latest" cache entry if it exists
          gh cache delete "coverage-baseline-latest" -R "$GITHUB_REPOSITORY" 2>/dev/null || true
        # Save is a separate step so the action handles the upload
      - name: Save latest coverage baseline (main/dev only)
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/coverage/report/coverage-summary.json
          key: coverage-baseline-latest

      - name: Upload JS coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-coverage
          path: examples/papi/coverage/

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: /tmp/coverage/report/

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-integration-test-logs
          path: |
            /tmp/omni-node.log
            /tmp/provider.log

  # ── Smart-contract demos ─────────────────────────────────────────────────────
  # Runs against its OWN chain + inmemory provider, in parallel with
  # integration-tests and e2e-integration-tests. The runtime wasm and provider
  # come prebuilt in the artifact; this job only installs solc/resolc and
  # compiles the example Solidity contracts.
  sc-integration-tests:
    name: SC Integration Tests (${{ matrix.runtime.name }})
    runs-on: parity-large
    timeout-minutes: 30
    needs: [set-image, runtime-matrix, build]
    container:
      image: ${{ needs.set-image.outputs.CI_IMAGE }}
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.runtime-matrix.outputs.runtime) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Load common environment variables via env file
        run: cat .github/env >> $GITHUB_ENV

      - name: Install just
        run: cargo install just --locked || true

      - name: Cache Polkadot SDK binaries
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: sdk-cache
        with:
          path: |
            .bin/polkadot
            .bin/polkadot-execute-worker
            .bin/polkadot-prepare-worker
            .bin/polkadot-omni-node
            .bin/chain-spec-builder
          key: polkadot-sdk-${{ env.POLKADOT_SDK_VERSION }}

      - name: Download Polkadot SDK binaries
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: just polkadot_version=${{ env.POLKADOT_SDK_VERSION }} download-polkadot-sdk-binaries

      - name: Cache zombienet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: zombienet-cache
        with:
          path: .bin/zombienet
          key: zombienet-${{ env.ZOMBIENET_VERSION }}

      - name: Download zombienet
        if: steps.zombienet-cache.outputs.cache-hit != 'true'
        run: just zombienet_version=${{ env.ZOMBIENET_VERSION }} download-zombienet

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Extract into target/release so the artifact's target/release-rooted
      # contents land back at their original paths (see integration-tests job).
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: build
          path: target/release

      - name: Restore executable bits
        run: chmod +x target/release/storage-provider-node

      - name: Install solc and resolc
        run: |
          for bin_url in \
            "/usr/local/bin/solc https://github.com/ethereum/solidity/releases/download/v${SOLC_VERSION}/solc-static-linux" \
            "/usr/local/bin/resolc https://github.com/paritytech/revive/releases/download/v${RESOLC_VERSION}/resolc-x86_64-unknown-linux-musl"; do
            dest="${bin_url%% *}"
            url="${bin_url#* }"
            for attempt in 1 2 3; do
              echo "Downloading $dest (attempt $attempt/3)..."
              if curl -L --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 600 \
                  -o "$dest" "$url"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to download $dest after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 5))
            done
          done
          chmod +x /usr/local/bin/solc /usr/local/bin/resolc
          solc --version
          resolc --version

      - name: Build example contracts
        run: just build-contracts

      - name: Start chain
        uses: ./.github/actions/start-zombienet
        with:
          config: ${{ matrix.runtime.zombienet_config }}

      - name: Wait for parachain blocks
        uses: ./.github/actions/wait-for-parachain

      - name: Start provider (inmemory)
        run: |
          echo "//Alice" > /tmp/alice-key && chmod 600 /tmp/alice-key
          nohup ./target/release/storage-provider-node \
            --keyfile /tmp/alice-key --storage-mode inmemory \
            --bind-addr 0.0.0.0:3333 --chain-rpc ws://127.0.0.1:2222 \
            --enable-agreement-coordinator --enable-checkpoint-coordinator \
            > /tmp/provider.log 2>&1 &

      - name: Wait for provider health
        uses: ./.github/actions/wait-for-provider-health

      - name: Run smart-contract end-to-end demo
        run: just sc-demo "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run smart-contract precompile-coverage e2e
        run: just drain-tx-pool-then sc-coverage "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run SharedTeamDrive dApp e2e
        run: just drain-tx-pool-then sc-team-drive "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Run TokenGatedDrive dApp e2e
        run: just drain-tx-pool-then sc-token-gated "http://127.0.0.1:3333" "//Alice" "//Bob"

      - name: Stop services
        if: always()
        run: |
          pkill -f "polkadot-omni-node" 2>/dev/null || true
          pkill -f "polkadot" 2>/dev/null || true
          pkill -f "storage-provider-node" 2>/dev/null || true

      - name: Upload logs (on failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sc-integration-test-logs-${{ matrix.runtime.name }}
          path: |
            /tmp/zombienet.log
            /tmp/provider.log
            /tmp/zombie-*/*.log
            /tmp/zombie-*/**/*.log
            /tmp/zombie-*/*-plain.json
            /tmp/zombie-*/*-raw.json

  # ── Coverage gate ─────────────────────────────────────────────────────────
  # On PRs: restores the cached baseline from main/dev, downloads the PR's
  # coverage summary from the e2e job artifact, and fails if any metric
  # (pallet, provider, JS) decreased.
  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-integration-tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: Restore coverage baseline
        id: baseline
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: /tmp/coverage/report/coverage-summary.json
          key: coverage-baseline-latest

      - name: Download PR coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6
        with:
          name: rust-coverage
          path: /tmp/pr-coverage

      - name: Compare coverage
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  Coverage Comparison (base → PR)"
          echo "═══════════════════════════════════════════════════════════"

          # If no baseline exists yet (first run on main), skip the gate
          if [ ! -f /tmp/coverage/report/coverage-summary.json ]; then
            echo "No baseline found (first run?) — skipping comparison."
            echo ""
            echo "PR coverage:"
            cat /tmp/pr-coverage/coverage-summary.json | python3 -m json.tool
            exit 0
          fi

          BASE=/tmp/coverage/report/coverage-summary.json
          PR=/tmp/pr-coverage/coverage-summary.json

          echo "Base: $(cat $BASE)"
          echo "PR:   $(cat $PR)"
          echo ""

          FAILED=0
          for METRIC in pallet provider js; do
            BASE_VAL=$(python3 -c "import json; d=json.load(open('$BASE')); print(d.get('$METRIC', 0))")
            PR_VAL=$(python3 -c "import json; d=json.load(open('$PR')); print(d.get('$METRIC', 0))")

            DECREASED=$(awk "BEGIN { print ($PR_VAL < $BASE_VAL) ? 1 : 0 }")
            if [ "$DECREASED" = "1" ]; then
              echo "FAIL: $METRIC coverage decreased: ${BASE_VAL}% → ${PR_VAL}%"
              FAILED=1
            else
              echo "PASS: $METRIC coverage: ${BASE_VAL}% → ${PR_VAL}%"
            fi
          done

          echo ""
          if [ "$FAILED" = "1" ]; then
            echo "Coverage decreased — add tests to cover new or modified code."
            exit 1
          else
            echo "All coverage metrics maintained or improved."
          fi

  integration-tests-complete:
    name: Integration Tests
    needs: [build, integration-tests, e2e-integration-tests, sc-integration-tests, coverage-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Decide outcome
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Integration tests failed or were cancelled"
          exit 1
