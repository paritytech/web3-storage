name: UI Checks

on:
  push:
    branches: [main, dev]
    paths:
      - "user-interfaces/**"
      - ".github/workflows/ui-checks.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "user-interfaces/**"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: user-interfaces/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: user-interfaces
        run: pnpm install --frozen-lockfile
        # postinstall regenerates the shared @polkadot-api/descriptors
        # dist/ from committed metadata — no per-UI generate step needed.

      - name: Run unit tests
        working-directory: user-interfaces
        run: pnpm run test:unit

  build:
    name: Typecheck + build (${{ matrix.ui }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ui: drive-ui
            filter: "@web3-storage/drive-ui"
          - ui: console-ui
            filter: "@web3-storage/console-ui"
          - ui: provider
            filter: provider-dashboard
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: user-interfaces/pnpm-lock.yaml

      - name: Install workspace deps
        working-directory: user-interfaces
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: user-interfaces
        run: pnpm --filter ${{ matrix.filter }} run build
