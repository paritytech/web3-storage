name: UI Checks

on:
  push:
    branches: [main, dev]
    paths:
      - "user-interfaces/**"
      - ".github/workflows/ui-checks.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "user-interfaces/**"
      - ".github/workflows/ui-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo gitignores pnpm-lock.yaml, so setup-node's `cache: pnpm`
      # can't compute a cache key. Cache the pnpm store directly, keyed on
      # the hashes of every workspace package.json instead.
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('user-interfaces/**/package.json', 'user-interfaces/pnpm-workspace.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install workspace deps
        working-directory: user-interfaces
        run: pnpm install --frozen-lockfile=false

      - name: Generate console-ui PAPI descriptors
        working-directory: user-interfaces
        run: pnpm --filter @web3-storage/console-ui exec papi generate

      - name: Generate drive-ui PAPI descriptors
        working-directory: user-interfaces
        run: pnpm --filter @web3-storage/drive-ui exec papi generate

      - name: Run unit tests
        working-directory: user-interfaces
        run: pnpm run test:unit

  build:
    name: Typecheck + build (${{ matrix.ui }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ui: drive-ui
            filter: "@web3-storage/drive-ui"
            papi: true
          - ui: console-ui
            filter: "@web3-storage/console-ui"
            papi: true
          - ui: provider
            filter: provider-dashboard
            papi: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo gitignores pnpm-lock.yaml, so setup-node's `cache: pnpm`
      # can't compute a cache key. Cache the pnpm store directly, keyed on
      # the hashes of every workspace package.json instead.
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('user-interfaces/**/package.json', 'user-interfaces/pnpm-workspace.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install workspace deps
        working-directory: user-interfaces
        run: pnpm install --frozen-lockfile=false

      - name: Generate PAPI descriptors
        if: matrix.papi
        working-directory: user-interfaces
        run: pnpm --filter ${{ matrix.filter }} exec papi generate

      - name: Build
        working-directory: user-interfaces
        run: pnpm --filter ${{ matrix.filter }} run build
