[workspace]
resolver = "2"
members = [
	"client",
	"crates/pallets/drive-registry",
	"crates/pallets/s3-registry",
	"crates/pallets/storage-provider",
	"crates/storage-subxt",
	"crates/utils/storage-indexers",
	"provider-node",
	"provider/negotiation",
	"runtimes/web3-storage-local",
	"runtimes/web3-storage-paseo",

	# Shared primitives
	"crates/primitives/file-system",
	"crates/primitives/s3",
	"crates/primitives/storage",

	# Smart-contract precompiles (pallet_revive integration)
	"precompiles/drive-registry-precompile",
	"precompiles/s3-registry-precompile",
	"precompiles/storage-provider-precompile",

	# Storage Interfaces: File System Interface
	"storage-interfaces/file-system/client",

	# Storage Interfaces: S3-Compatible Interface
	"storage-interfaces/s3/client",
]

[workspace.package]
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/paritytech/web3-storage"

[workspace.dependencies]
# Layer 0: Scalable Web3 Storage (Internal crates)
pallet-drive-registry-precompile = { path = "precompiles/drive-registry-precompile", default-features = false }
pallet-s3-registry-precompile = { path = "precompiles/s3-registry-precompile", default-features = false }
pallet-storage-provider = { path = "crates/pallets/storage-provider", default-features = false }
pallet-storage-provider-precompile = { path = "precompiles/storage-provider-precompile", default-features = false }
provider-negotiation = { path = "provider/negotiation" }
storage-client = { path = "client" }
storage-indexers = { path = "crates/utils/storage-indexers" }
storage-parachain-runtime = { path = "runtimes/web3-storage-local" }
storage-primitives = { path = "crates/primitives/storage", default-features = false }
storage-provider-node = { path = "provider-node" }
storage-subxt = { path = "crates/storage-subxt" }

# Storage Interfaces: File System Interface
file-system-client = { path = "storage-interfaces/file-system/client" }
file-system-primitives = { path = "crates/primitives/file-system", default-features = false }
pallet-drive-registry = { path = "crates/pallets/drive-registry", default-features = false }

# Storage Interfaces: S3-Compatible Interface
pallet-s3-registry = { path = "crates/pallets/s3-registry", default-features = false }
s3-client = { path = "storage-interfaces/s3/client" }
s3-primitives = { path = "crates/primitives/s3", default-features = false }

# Substrate frame
frame-benchmarking = { version = "46.0.0", default-features = false }
frame-executive = { version = "46.0.0", default-features = false }
frame-metadata-hash-extension = { version = "0.14.0", default-features = false }
frame-support = { version = "46.0.0", default-features = false }
frame-system = { version = "46.0.0", default-features = false }
frame-system-benchmarking = { version = "46.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "41.0.0", default-features = false }
frame-try-runtime = { version = "0.52.0", default-features = false }
polkadot-sdk-frame = { version = "0.15.0", default-features = false }

# Substrate pallets
pallet-aura = { version = "45.0.0", default-features = false }
pallet-authorship = { version = "46.0.0", default-features = false }
pallet-balances = { version = "47.0.0", default-features = false }
pallet-collator-selection = { version = "27.0.0", default-features = false }
pallet-message-queue = { version = "49.0.0", default-features = false }
pallet-revive = { version = "0.13.0", default-features = false }
pallet-session = { version = "46.0.0", default-features = false }
pallet-sudo = { version = "46.0.0", default-features = false }
pallet-timestamp = { version = "45.0.0", default-features = false }
pallet-transaction-payment = { version = "46.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "46.0.0", default-features = false }
pallet-utility = { version = "46.0.0", default-features = false }

# Substrate primitives
sp-api = { version = "41.0.0", default-features = false }
sp-block-builder = { version = "41.0.0", default-features = false }
sp-consensus-aura = { version = "0.47.0", default-features = false }
sp-core = { version = "40.0.0", default-features = false }
sp-genesis-builder = { version = "0.22.0", default-features = false }
sp-inherents = { version = "41.0.0", default-features = false }
sp-io = { version = "45.0.0", default-features = false }
sp-offchain = { version = "41.0.0", default-features = false }
sp-runtime = { version = "46.0.0", default-features = false }
sp-session = { version = "43.0.0", default-features = false }
sp-storage = { version = "23.0.0", default-features = false }
sp-transaction-pool = { version = "41.0.0", default-features = false }
sp-version = { version = "44.0.0", default-features = false }

# Polkadot
pallet-xcm = { version = "26.0.0", default-features = false }
pallet-xcm-benchmarks = { version = "26.0.0", default-features = false }
parachains-runtimes-test-utils = { version = "29.0.0", default-features = true }
polkadot-parachain-primitives = { version = "21.0.0", default-features = false }
polkadot-primitives = { version = "23.0.0", default-features = false }
polkadot-runtime-common = { version = "25.0.0", default-features = false }
xcm = { version = "22.0.0", default-features = false, package = "staging-xcm" }
xcm-builder = { version = "26.0.0", default-features = false, package = "staging-xcm-builder" }
xcm-executor = { version = "25.0.0", default-features = false, package = "staging-xcm-executor" }
xcm-runtime-apis = { version = "0.13.0", default-features = false }

# Cumulus
cumulus-pallet-aura-ext = { version = "0.26.0", default-features = false }
cumulus-pallet-parachain-system = { version = "0.26.0", default-features = false }
cumulus-pallet-session-benchmarking = { version = "27.0.0", default-features = false }
cumulus-pallet-weight-reclaim = { version = "0.8.0", default-features = false }
cumulus-pallet-xcm = { version = "0.25.0", default-features = false }
cumulus-pallet-xcmp-queue = { version = "0.26.0", default-features = false }
cumulus-primitives-aura = { version = "0.22.0", default-features = false }
cumulus-primitives-core = { version = "0.24.0", default-features = false }
cumulus-primitives-utility = { version = "0.26.0", default-features = false }
parachain-info = { version = "0.26.0", default-features = false, package = "staging-parachain-info" }
parachains-common = { version = "28.0.0", default-features = false }

# Build dependencies
prost-build = "0.13"
substrate-wasm-builder = { version = "32.0.0" }

# Codec
codec = { version = "3.7.5", default-features = false, features = [
	"derive",
	"max-encoded-len",
], package = "parity-scale-codec" }
scale-info = { version = "2.11.6", default-features = false, features = [
	"derive",
] }

# External dependencies
async-trait = "0.1"
base64 = "0.22"
bincode = "1.3"
clap = { version = "4" }
futures = "0.3"
hex = { version = "0.4", default-features = false }
prost = "0.13"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
serde_with = { version = "3.20.0" }
thiserror = "2.0"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "=0.3.19" }

# Async/HTTP (for provider node)
axum = "0.7"
dashmap = "6.0"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocksdb = { version = "0.22", default-features = false }
tokio = { version = "1.0", features = ["full"] }
tokio-rate-limit = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Crypto
bip39 = "2.0"
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = "0.10"
rand = "0.8"

# Subxt (chain interaction for off-chain clients)
subxt = { version = "0.50.2" }
subxt-rpcs = { version = "0.50.2" }
subxt-signer = { version = "0.50.2", features = ["sr25519"] }

# Testing
sp-keyring = { version = "46.0.0", default-features = false }
sp-keystore = { version = "0.46.0", default-features = false }
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
