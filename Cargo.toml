[workspace]
resolver = "2"
members = [
	# Storage pallet
	"crates/pallets/storage-provider",

	# Storage runtime
	"runtimes/web3-storage-paseo",

	# Shared primitives
	"crates/primitives/storage",
]

[workspace.package]
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/paritytech/web3-storage"

[workspace.dependencies]
# Layer 0: Scalable Web3 Storage (Internal crates)
pallet-storage-provider = { path = "crates/pallets/storage-provider", default-features = false }
storage-primitives = { path = "crates/primitives/storage", default-features = false }

# Substrate frame
frame-benchmarking = { version = "49.0.0", default-features = false }
frame-executive = { version = "48.0.0", default-features = false }
frame-metadata-hash-extension = { version = "0.16.0", default-features = false }
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
frame-system-benchmarking = { version = "49.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "43.0.0", default-features = false }
frame-try-runtime = { version = "0.54.0", default-features = false }
polkadot-sdk-frame = { version = "0.18.0", default-features = false }

# Substrate pallets
pallet-aura = { version = "48.0.0", default-features = false }
pallet-authorship = { version = "48.0.0", default-features = false }
pallet-balances = { version = "50.0.0", default-features = false }
pallet-collator-selection = { version = "30.0.0", default-features = false }
pallet-message-queue = { version = "52.0.0", default-features = false }
pallet-revive = { version = "0.19.0", default-features = false }
pallet-session = { version = "49.0.0", default-features = false }
pallet-sudo = { version = "49.0.0", default-features = false }
pallet-timestamp = { version = "48.0.0", default-features = false }
pallet-transaction-payment = { version = "49.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "49.0.0", default-features = false }
pallet-utility = { version = "49.0.0", default-features = false }

# Substrate primitives
sp-api = { version = "43.0.0", default-features = false }
sp-block-builder = { version = "43.0.0", default-features = false }
sp-consensus-aura = { version = "0.49.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-crypto-hashing = { version = "0.1.0", default-features = false }
sp-genesis-builder = { version = "0.24.0", default-features = false }
sp-inherents = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-offchain = { version = "43.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }
sp-session = { version = "45.0.0", default-features = false }
sp-storage = { version = "25.0.0", default-features = false }
sp-transaction-pool = { version = "43.0.0", default-features = false }
sp-version = { version = "46.0.0", default-features = false }

# Polkadot
pallet-xcm = { version = "29.0.0", default-features = false }
pallet-xcm-benchmarks = { version = "29.0.0", default-features = false }
parachains-runtimes-test-utils = { version = "33.0.0", default-features = true }
polkadot-parachain-primitives = { version = "23.0.0", default-features = false }
polkadot-primitives = { version = "25.0.0", default-features = false }
polkadot-runtime-common = { version = "29.0.0", default-features = false }
xcm = { version = "24.0.0", default-features = false, package = "staging-xcm" }
xcm-builder = { version = "29.0.0", default-features = false, package = "staging-xcm-builder" }
xcm-executor = { version = "28.0.0", default-features = false, package = "staging-xcm-executor" }
xcm-runtime-apis = { version = "0.16.0", default-features = false }

# Cumulus
cumulus-pallet-aura-ext = { version = "0.29.0", default-features = false }
cumulus-pallet-parachain-system = { version = "0.29.0", default-features = false }
cumulus-pallet-session-benchmarking = { version = "30.0.0", default-features = false }
cumulus-pallet-weight-reclaim = { version = "0.11.0", default-features = false }
cumulus-pallet-xcm = { version = "0.27.0", default-features = false }
cumulus-pallet-xcmp-queue = { version = "0.30.0", default-features = false }
cumulus-primitives-aura = { version = "0.24.0", default-features = false }
cumulus-primitives-core = { version = "0.26.0", default-features = false }
cumulus-primitives-utility = { version = "0.30.0", default-features = false }
parachain-info = { version = "0.28.0", default-features = false, package = "staging-parachain-info" }
parachains-common = { version = "32.0.0", default-features = false }

# Build dependencies
prost-build = "0.13"
substrate-wasm-builder = { version = "34.0.0" }

# Codec
codec = { version = "3.7.5", default-features = false, features = [
	"derive",
	"max-encoded-len",
], package = "parity-scale-codec" }
scale-info = { version = "2.11.6", default-features = false, features = [
	"derive",
] }

# External dependencies
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4" }
futures = "0.3"
hex = { version = "0.4", default-features = false }
prost = "0.13"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
serde_with = { version = "3.20.0" }
thiserror = "2.0"
tracing = { version = "0.1.41", default-features = false }
tracing-subscriber = { version = "0.3.23" }

# Async/HTTP (for provider node)
axum = "0.7"
dashmap = "6.0"
moka = { version = "0.12", features = ["future"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rocksdb = { version = "0.22", default-features = false }
tokio = { version = "1.0", features = ["full"] }
tokio-rate-limit = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Crypto
bip39 = "2.0"
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = "0.10"
rand = "0.8"

# Subxt (chain interaction for off-chain clients)
subxt = { version = "0.50.2" }
subxt-rpcs = { version = "0.50.2" }
subxt-signer = { version = "0.50.2", features = ["sr25519"] }

# Testing
sp-keyring = { version = "48.0.0", default-features = false }
sp-keystore = { version = "0.49.0", default-features = false }
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
panic = "unwind"

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
