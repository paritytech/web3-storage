[workspace]
resolver = "2"
members = [
    "primitives",
    "pallet",
    "provider-node",
    "client",
]

[workspace.package]
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/parity/scalable-web3-storage"

[workspace.dependencies]
# Internal crates
storage-primitives = { path = "primitives", default-features = false }
pallet-storage-provider = { path = "pallet", default-features = false }
storage-provider-node = { path = "provider-node" }
storage-client = { path = "client" }

# Substrate dependencies
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
frame-system = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
sp-core = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
sp-std = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
sp-api = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
parity-scale-codec = { version = "3.6", default-features = false, features = ["derive"] }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }

# External dependencies
bitvec = { version = "1.0", default-features = false }
log = { version = "0.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

# Async/HTTP (for provider node)
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }

# Crypto
blake2 = { version = "0.10", default-features = false }

# Testing
sp-keyring = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master" }

[profile.release]
panic = "unwind"
