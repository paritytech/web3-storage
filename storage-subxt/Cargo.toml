[package]
name = "storage-subxt"
description = "Rust bindings and interface to interact with Web3 Storage using subxt"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["./metadata"]
readme = "README.md"


[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
subxt = { workspace = true, features = ["jsonrpsee"], optional = true }
subxt-signer = { workspace = true, features = ["ecdsa", "sr25519", "subxt"] }
serde = { workspace = true, features = ["derive"] }
subxt-core = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"dep:subxt",
	"scale-info/std",
	"serde/std",
	"subxt-core/std",
	"subxt-signer/std",
	"subxt/jsonrpsee",
	"subxt/native",
]
# Select the network runtime bindings exposed as `storage_runtime`.
# Off (default): testnet (`storage_paseo_runtime`). On: mainnet (`storage_mainnet_runtime`).
mainnet = []
