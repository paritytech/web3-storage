[settings]
timeout = 1000
provider = "native"

[relaychain]
default_command = ".bin/polkadot"
chain = "westend-local"
default_args = ["-lruntime=info"]

[[relaychain.nodes]]
name = "alice"
validator = true
rpc_port = 9900

[[relaychain.nodes]]
name = "bob"
validator = true
rpc_port = 9901

[[parachains]]
id = 4000
cumulus_based = true
chain_spec_command = "./scripts/build-chain-spec.sh"

[[parachains.collators]]
name = "alice"
validator = true
command = ".bin/polkadot-omni-node"
rpc_port = 2222
args = ["--collator", "-lruntime=info,aura=trace,cumulus-collator=trace,parachain=debug"]
