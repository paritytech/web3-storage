[settings]
timeout = 1000
provider = "native"
node_spawn_timeout = 240

[relaychain]
default_command = ".bin/polkadot"
chain = "westend-local"
default_args = ["-lruntime=info"]

[[relaychain.nodes]]
name = "alice"
validator = true
rpc_port = 9900

[[relaychain.nodes]]
name = "bob"
validator = true
rpc_port = 9901

[[parachains]]
id = 4000
cumulus_based = true
chain_spec_command = "./scripts/build-chain-spec.sh"

[[parachains.collators]]
name = "alice"
validator = true
command = ".bin/polkadot-omni-node"
rpc_port = 2222
args = ["--collator", "--force-authoring", "-lruntime=info,aura=debug,cumulus-consensus=debug"]
keystore_key_types = ["aura"]
